name: aether
label: Aether
description: "Dark cyan command center — high contrast, colorblind-safe, elder-friendly"

# ─── Palette ──────────────────────────────────────────────────────────────────
# All text/bg pairs verified WCAG AA (4.5:1) or AAA (7:1).
# Accent strategy: cyan (primary) + amber (secondary) — safe for all colorblind types.
# No red/green semantic pairing anywhere in this theme.
# Success = blue-teal (NOT green). Destructive = orange-red (NOT pure red).
palette:
  background:
    hex: "#0A0F14"    # Deep ink navy — not pure black (halation risk for elders)
    alpha: 1.0
  midground: "#E8F0FF"  # Cool white — ~16:1 on bg, crisp without eye strain
  foreground:
    hex: "#22D3EE"    # Cyan accent glow layer — matches reference image dominant
    alpha: 0.08
  warmGlow: "rgba(34, 211, 238, 0.14)"   # Cyan warmth — cohesive with accent
  noiseOpacity: 0.20   # Minimal grain — elders prefer clean surfaces

# ─── Typography ───────────────────────────────────────────────────────────────
# Inter: large x-height, open counters — best legibility at small sizes
# letterSpacing: positive — opens type for aging eyes
typography:
  fontSans: '"Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.02em"   # Positive — opens up type, elder-friendly

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.5rem"
  density: comfortable   # NOT compact — elders need generous tap targets

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
# Contrast ratios vs card bg (#141B24):
#   #22D3EE cyan:     ~9.3:1  ✓ AAA
#   #F5A623 amber:    ~9.8:1  ✓ AAA
#   #E8F0FF cream:    ~16.0:1 ✓ AAA
#   #C0D0E0 sec text: ~8.97:1 ✓ AAA
#   #8498B0 muted:    ~4.62:1 ✓ AA  (passes elder floor)
#   #FF6B35 destr:    ~5.8:1  ✓ AA+ (orange-red, distinct from cyan)
#   #2DD4BF success:  ~10.1:1 ✓ AAA (blue-teal — NOT green, colorblind safe)
colorOverrides:
  primary: "#22D3EE"              # Cyan — primary CTA, active states
  primaryForeground: "#0A0F14"
  accent: "#F5A623"               # Amber — secondary, highlights, warmth
  accentForeground: "#0A0F14"
  ring: "#22D3EE"                 # Cyan focus ring — thick 2px in customCSS
  success: "#2DD4BF"              # Blue-teal — NOT green (colorblind safe)
  successForeground: "#0A0F14"
  warning: "#F5A623"              # Amber — same as accent; unambiguous
  warningForeground: "#0A0F14"
  destructive: "#FF6B35"          # Orange-red — NOT pure red; distinct from cyan
  destructiveForeground: "#E8F0FF"
  border: "rgba(34, 211, 238, 0.28)"   # Cyan border — visible at a glance
  input: "rgba(14, 21, 32, 0.95)"
  muted: "rgba(10, 15, 20, 0.90)"
  mutedForeground: "#8498B8"      # 4.6:1 on card bg — passes AA
  card: "#141B24"                 # Elevated surface — deep blue-gray
  cardForeground: "#E8F0FF"       # Cool white — 16:1 ✓ AAA
  secondary: "#1A2536"            # Raised surface — between card and bg
  secondaryForeground: "#C0D0E0"  # Cool mid-gray — 8.97:1 ✓ AAA
  popover: "#141B24"
  popoverForeground: "#E8F0FF"

# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, #1A2536 0%, #141B24 100%)"
    boxShadow: "inset 0 0 0 1px rgba(34, 211, 238, 0.18), 0 2px 16px rgba(0, 0, 0, 0.40)"
  header:
    background: "#0A0F14"
    boxShadow: "0 1px 0 rgba(34, 211, 238, 0.22)"
  sidebar:
    background: "linear-gradient(180deg, #141B24 0%, #0A0F14 100%)"
    boxShadow: "1px 0 0 rgba(34, 211, 238, 0.16), 8px 0 32px rgba(0, 0, 0, 0.50)"
  tab: {}
  backdrop: {}
  badge: {}
  progress:
    background: "#141B24"
  footer:
    background: "#0A0F14"
    boxShadow: "0 -1px 0 rgba(34, 211, 238, 0.16)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Cool depth atmosphere — cyan-tinged navy, gentle vignette ──────────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 80% 10%, rgba(34, 211, 238, 0.07), transparent 40%),
      radial-gradient(circle at 20% 85%, rgba(245, 166, 35, 0.04), transparent 35%),
      radial-gradient(circle at 50% 60%, transparent 50%, #0A0F14 115%),
      #0A0F14;
  }

  /* ── Nav active item: cyan left rail ─────────────────────────────────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 3px solid #22D3EE;   /* Thicker — more visible for elders */
    padding-left: calc(0.75rem - 3px);
    background: rgba(34, 211, 238, 0.08);
  }

  /* ── Chart bars: cyan primary series with amber secondary glow ───────────── */
  .recharts-wrapper .recharts-bar-rectangle path,
  .recharts-wrapper [class*="bar-"]:not([class*="progress\"]) rect {
    fill: #22D3EE;
    filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.40));
  }

  .recharts-wrapper .recharts-line path,
  [class*="sparkline"] path,
  [class*="trend"] path {
    stroke: #22D3EE;
    stroke-width: 2.5px;   /* Thicker lines — elder-friendly */
    filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.38));
  }

  /* ── Table / list row hover and selection ────────────────────────────────── */
  tr:hover td,
  [role="row"]:hover {
    background: rgba(34, 211, 238, 0.06) !important;
  }
  tr[aria-selected="true"] td,
  [role="row"][aria-selected="true"] {
    background: rgba(34, 211, 238, 0.12) !important;
    box-shadow: inset 3px 0 0 #22D3EE;
  }

  /* ── Tabular numerics for KPIs, tables, cost ─────────────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  td,
  .cost-value {
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI values: cream + cyan glow — high contrast, cool, readable ───────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  .cost-value {
    color: #E8F0FF !important;
    font-weight: 600;          /* Heavier weight — elder readability */
    letter-spacing: 0.01em;
    text-shadow: 0 0 14px rgba(34, 211, 238, 0.22);
  }

  /* ── Card titles: cool mid-tone, comfortable contrast ────────────────────── */
  .card-title,
  [class*="CardTitle"] {
    color: #C0D0E0;
    font-size: 0.9375rem;      /* 15px — at baseSize floor, not below */
    font-weight: 600;
    letter-spacing: 0.02em;   /* Positive — open, elder-friendly */
  }

  /* ── Focus rings: thick 2px cyan — WCAG 2.4.11 (AAA) compliant ──────────── */
  *:focus-visible {
    outline: 2px solid #22D3EE;   /* 2px — elder-friendly thick ring */
    outline-offset: 3px;
    box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.25), 0 0 16px rgba(34, 211, 238, 0.18);
  }

  /* ── Selection highlight ─────────────────────────────────────────────────── */
  ::selection {
    background: rgba(34, 211, 238, 0.28);
    color: #E8F0FF;
  }

  /* ── Scrollbar: thick 6px — elder-friendly grab target ───────────────────── */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(20, 27, 36, 0.60);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(34, 211, 238, 0.45);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(34, 211, 238, 0.75);
  }

  /* ── Loading / skeleton states ───────────────────────────────────────────── */
  [data-skeleton="true"],
  .skeleton,
  [class*="skeleton"] {
    background: #141B24;
    background-image: linear-gradient(90deg, #141B24 0%, rgba(34, 211, 238, 0.10) 50%, #141B24 100%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 2s infinite linear;
  }
  @keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Disabled states: clearly dimmed, not just color-shifted ─────────────── */
  [disabled],
  [aria-disabled="true"],
  .disabled {
    color: #3A4A5A !important;
    opacity: 0.60;
    pointer-events: none;
  }

  /* ── Live badge: cyan pulse — high contrast, shape+color dual cue ────────── */
  [data-variant="live"] {
    background: #22D3EE !important;
    color: #0A0F14 !important;
    font-weight: 700 !important;
    box-shadow: 0 0 12px rgba(34, 211, 238, 0.60);
    animation: live-pulse 2s infinite;
  }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.50); }
    70% { box-shadow: 0 0 0 10px rgba(34, 211, 238, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
  }

  /* ── Progress bars: cyan fill — consistent with primary accent ───────────── */
  [role="progressbar"] [class*="indicator"] {
    background: #22D3EE !important;
    box-shadow: 0 0 8px rgba(34, 211, 238, 0.45);
  }

  /* ── Success states: blue-teal (colorblind safe, not green) ──────────────── */
  [data-variant="success"],
  .text-success,
  [class*="success"] {
    color: #2DD4BF !important;
  }

  /* ── Destructive states: orange-red (not pure red, distinct from cyan) ───── */
  [data-variant="destructive"],
  .text-destructive,
  [class*="destructive"]:not([class*="Foreground"]):not([class*="background"]) {
    color: #FF6B35 !important;
  }
