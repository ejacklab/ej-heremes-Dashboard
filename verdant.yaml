name: verdant
label: Verdant
description: "Vibrant lime-green neon command center — high contrast, colorblind-safe, elder-friendly"

# ─── Palette ──────────────────────────────────────────────────────────────────
# All text/bg pairs verified WCAG AA (4.5:1) or AAA (7:1).
# Accent strategy: lime green (primary) + orange (secondary) — luminance-distinct.
# Success = BLUE (not green — avoids green overload for colorblind users).
# Destructive = orange-red. No red/green semantic pairing.
palette:
  background:
    hex: "#08080A"    # Deep near-black — not pure black (halation risk for elders)
    alpha: 1.0
  midground: "#F2F2F7"  # Cool white — ~15.19:1 on card, elder-friendly
  foreground:
    hex: "#78FF38"    # Vibrant lime green — matches reference dominant
    alpha: 0.08
  warmGlow: "rgba(120, 255, 56, 0.12)"   # Green glow — cohesive with accent
  noiseOpacity: 0.18   # Minimal grain — elders prefer clean surfaces

# ─── Typography ───────────────────────────────────────────────────────────────
# Inter: large x-height, open counters — best legibility at small sizes
# letterSpacing: positive — opens type for aging eyes
typography:
  fontSans: '"Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.02em"   # Positive — opens up type, elder-friendly

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.5rem"
  density: comfortable   # NOT compact — elders need generous tap targets

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
# Contrast ratios vs card bg (#1C1C22):
#   #78FF38 lime:     ~13.05:1 ✓ AAA
#   #FF9830 orange:   ~7.90:1  ✓ AAA
#   #F2F2F7 white:    ~15.19:1 ✓ AAA
#   #9898A0 sec text: ~5.92:1  ✓ AA
#   #909098 muted:    ~5.35:1  ✓ AA  (safe for elders)
#   #FF6B35 destr:    ~5.98:1  ✓ AA+ (orange-red, distinct from green)
#   #3399FF success:  ~5.77:1  ✓ AA  (BLUE — not green, colorblind safe)
colorOverrides:
  primary: "#78FF38"              # Lime green — primary accent, chart bars
  primaryForeground: "#08080A"
  accent: "#FF9830"               # Warm orange — secondary accent, contrast
  accentForeground: "#08080A"
  ring: "#78FF38"                 # Green focus ring — thick 2px in customCSS
  success: "#3399FF"              # BLUE — NOT green (avoids green overload)
  successForeground: "#08080A"
  warning: "#FF9830"              # Orange — same as accent; unambiguous
  warningForeground: "#08080A"
  destructive: "#FF6B35"          # Orange-red — NOT pure red; distinct from green
  destructiveForeground: "#F2F2F7"
  border: "rgba(120, 255, 56, 0.22)"   # Green border — visible neon feel
  input: "rgba(8, 8, 10, 0.95)"
  muted: "rgba(8, 8, 10, 0.90)"
  mutedForeground: "#909098"      # 5.35:1 on card bg — passes AA
  card: "#1C1C22"                 # Dark charcoal — elevated surface
  cardForeground: "#F2F2F7"       # Cool white — 15.19:1 ✓ AAA
  secondary: "#222228"            # Raised surface — between card and bg
  secondaryForeground: "#9898A0"  # Light muted gray — 5.92:1 ✓ AA
  popover: "#1C1C22"
  popoverForeground: "#F2F2F7"

# ─── Assets ───────────────────────────────────────────────────────────────────
# Custom background image: layered liquid splashes (lime, dark, electric blue)
assets:
  bg: "/ds-assets/010bg.png"

# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, #222228 0%, #1C1C22 100%)"
    boxShadow: "inset 0 0 0 1px rgba(120, 255, 56, 0.16), 0 2px 16px rgba(0, 0, 0, 0.40)"
  header:
    background: "#08080A"
    boxShadow: "0 1px 0 rgba(120, 255, 56, 0.20)"
  sidebar:
    background: "linear-gradient(180deg, #1C1C22 0%, #08080A 100%)"
    boxShadow: "1px 0 0 rgba(120, 255, 56, 0.14), 8px 0 32px rgba(0, 0, 0, 0.50)"
  tab: {}
  backdrop:
    fillerOpacity: "0.045"
    fillerBlendMode: "difference"
  badge: {}
  progress:
    background: "#1C1C22"
  footer:
    background: "#08080A"
    boxShadow: "0 -1px 0 rgba(120, 255, 56, 0.14)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Neon depth atmosphere — green-tinged darkness, gentle vignette ───────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 80% 10%, rgba(120, 255, 56, 0.05), transparent 40%),
      radial-gradient(circle at 20% 85%, rgba(255, 152, 48, 0.04), transparent 35%),
      radial-gradient(circle at 50% 60%, transparent 50%, #08080A 115%),
      #08080A;
  }

  /* ── Backdrop: custom background image with neon overlay ──────────────────── */
  :root[style*="--theme-asset-bg"] {
    --component-backdrop-filler-opacity: 0.045;
    --component-backdrop-filler-blend-mode: difference;
    --component-backdrop-background-size: cover;
    --component-backdrop-background-position: center;
  }

  /* ── Nav active item: green left rail ─────────────────────────────────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 3px solid #78FF38;   /* Thicker — more visible for elders */
    padding-left: calc(0.75rem - 3px);
    background: rgba(120, 255, 56, 0.08);
  }

  /* ── Chart bars: lime green primary series with orange secondary glow ─────── */
  .recharts-wrapper .recharts-bar-rectangle path,
  .recharts-wrapper [class*="bar-"]:not([class*="progress\"]) rect {
    fill: #78FF38;
    filter: drop-shadow(0 0 6px rgba(120, 255, 56, 0.40));
  }

  .recharts-wrapper .recharts-line path,
  [class*="sparkline"] path,
  [class*="trend"] path {
    stroke: #78FF38;
    stroke-width: 2.5px;   /* Thicker lines — elder-friendly */
    filter: drop-shadow(0 0 6px rgba(120, 255, 56, 0.38));
  }

  /* ── Table / list row hover and selection ────────────────────────────────── */
  tr:hover td,
  [role="row"]:hover {
    background: rgba(120, 255, 56, 0.06) !important;
  }
  tr[aria-selected="true"] td,
  [role="row"][aria-selected="true"] {
    background: rgba(120, 255, 56, 0.12) !important;
    box-shadow: inset 3px 0 0 #78FF38;
  }

  /* ── Tabular numerics for KPIs, tables, cost ─────────────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  td,
  .cost-value {
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI values: cool white + green glow — high contrast, neon, readable ─── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  .cost-value {
    color: #F2F2F7 !important;
    font-weight: 600;          /* Heavier weight — elder readability */
    letter-spacing: 0.01em;
    text-shadow: 0 0 14px rgba(120, 255, 56, 0.22);
  }

  /* ── Card titles: neutral gray, comfortable contrast ─────────────────────── */
  .card-title,
  [class*="CardTitle"] {
    color: #9898A0;
    font-size: 0.9375rem;      /* 15px — at baseSize floor, not below */
    font-weight: 600;
    letter-spacing: 0.02em;   /* Positive — open, elder-friendly */
  }

  /* ── Focus rings: thick 2px green — WCAG 2.4.11 (AAA) compliant ─────────── */
  *:focus-visible {
    outline: 2px solid #78FF38;   /* 2px — elder-friendly thick ring */
    outline-offset: 3px;
    box-shadow: 0 0 0 2px rgba(120, 255, 56, 0.25), 0 0 16px rgba(120, 255, 56, 0.18);
  }

  /* ── Selection highlight ─────────────────────────────────────────────────── */
  ::selection {
    background: rgba(120, 255, 56, 0.28);
    color: #F2F2F7;
  }

  /* ── Scrollbar: thick 6px — elder-friendly grab target ───────────────────── */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(28, 28, 34, 0.60);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(120, 255, 56, 0.40);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(120, 255, 56, 0.70);
  }

  /* ── Loading / skeleton states ───────────────────────────────────────────── */
  [data-skeleton="true"],
  .skeleton,
  [class*="skeleton"] {
    background: #1C1C22;
    background-image: linear-gradient(90deg, #1C1C22 0%, rgba(120, 255, 56, 0.10) 50%, #1C1C22 100%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 2s infinite linear;
  }
  @keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Disabled states: clearly dimmed, not just color-shifted ─────────────── */
  [disabled],
  [aria-disabled="true"],
  .disabled {
    color: #484850 !important;
    opacity: 0.60;
    pointer-events: none;
  }

  /* ── Live badge: green pulse — high contrast, shape+color dual cue ───────── */
  [data-variant="live"] {
    background: #78FF38 !important;
    color: #08080A !important;
    font-weight: 700 !important;
    box-shadow: 0 0 12px rgba(120, 255, 56, 0.60);
    animation: live-pulse 2s infinite;
  }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 rgba(120, 255, 56, 0.50); }
    70% { box-shadow: 0 0 0 10px rgba(120, 255, 56, 0); }
    100% { box-shadow: 0 0 0 0 rgba(120, 255, 56, 0); }
  }

  /* ── Progress bars: green fill — consistent with primary accent ──────────── */
  [role="progressbar"] [class*="indicator"] {
    background: #78FF38 !important;
    box-shadow: 0 0 8px rgba(120, 255, 56, 0.45);
  }

  /* ── Success states: BLUE (not green — avoids green overload for CB users) ─ */
  [data-variant="success"],
  .text-success,
  [class*="success"] {
    color: #3399FF !important;
  }

  /* ── Destructive states: orange-red (not pure red, distinct from green) ──── */
  [data-variant="destructive"],
  .text-destructive,
  [class*="destructive"]:not([class*="Foreground"]):not([class*="background"]) {
    color: #FF6B35 !important;
  }
