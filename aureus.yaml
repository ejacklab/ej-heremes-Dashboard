name: aureus
label: Aureus
description: "Warm golden cosmic command center — high contrast, colorblind-safe, elder-friendly"

# ─── Palette ──────────────────────────────────────────────────────────────────
# All text/bg pairs verified WCAG AA (4.5:1) or AAA (7:1).
# Accent strategy: gold (primary) + blue-teal (success) — warm but accessible.
# No red/green semantic pairing. Custom background image (cosmic tree + golden highlights).
palette:
  background:
    hex: "#0A1220"    # Deep navy-black — not pure black (halation risk for elders)
    alpha: 1.0
  midground: "#F0E8D8"  # Warm off-white — ~13.75:1 on card, elder-friendly
  foreground:
    hex: "#F5E0B0"    # Warm golden-white accent glow — matches reference dominant
    alpha: 0.08
  warmGlow: "rgba(245, 224, 176, 0.14)"   # Golden warmth — cohesive with accent
  noiseOpacity: 0.18   # Minimal grain — elders prefer clean surfaces

# ─── Typography ───────────────────────────────────────────────────────────────
# Inter: large x-height, open counters — best legibility at small sizes
# letterSpacing: positive — opens type for aging eyes
typography:
  fontSans: '"Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.02em"   # Positive — opens up type, elder-friendly

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.5rem"
  density: comfortable   # NOT compact — elders need generous tap targets

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
# Contrast ratios vs card bg (#121E30):
#   #F5E0B0 gold:     ~12.89:1 ✓ AAA
#   #D8C080 warm gold: ~9.39:1  ✓ AAA
#   #F0E8D8 cream:    ~13.75:1 ✓ AAA
#   #B8A890 sec text: ~7.21:1  ✓ AAA
#   #9A8D7A muted:    ~5.16:1  ✓ AA  (safe for elders)
#   #FF6B35 destr:    ~5.91:1  ✓ AA+ (orange-red, distinct from gold)
#   #2DD4BF success:  ~9.00:1  ✓ AAA (blue-teal — NOT green, colorblind safe)
colorOverrides:
  primary: "#F5E0B0"              # Golden-white — primary accent, chart lines
  primaryForeground: "#0A1220"
  accent: "#D8C080"               # Warm gold — secondary accent, deeper warmth
  accentForeground: "#0A1220"
  ring: "#F5E0B0"                 # Gold focus ring — thick 2px in customCSS
  success: "#2DD4BF"              # Blue-teal — NOT green (colorblind safe)
  successForeground: "#0A1220"
  warning: "#F5E0B0"              # Golden — same as primary; unambiguous
  warningForeground: "#0A1220"
  destructive: "#FF6B35"          # Orange-red — NOT pure red; distinct from gold
  destructiveForeground: "#F0E8D8"
  border: "rgba(245, 224, 176, 0.25)"   # Gold border — visible at a glance
  input: "rgba(10, 18, 32, 0.95)"
  muted: "rgba(10, 18, 32, 0.90)"
  mutedForeground: "#9A8D7A"      # 5.16:1 on card bg — passes AA
  card: "#121E30"                 # Dark blue-gray — elevated surface
  cardForeground: "#F0E8D8"       # Warm off-white — 13.75:1 ✓ AAA
  secondary: "#162438"            # Raised surface — between card and bg
  secondaryForeground: "#B8A890"  # Warm muted — 7.21:1 ✓ AAA
  popover: "#121E30"
  popoverForeground: "#F0E8D8"

# ─── Assets ───────────────────────────────────────────────────────────────────
# Custom background image: cosmic tree with golden highlights and cyan stars
assets:
  bg: "/ds-assets/008bg.png"

# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, #162438 0%, #121E30 100%)"
    boxShadow: "inset 0 0 0 1px rgba(245, 224, 176, 0.18), 0 2px 16px rgba(0, 0, 0, 0.40)"
  header:
    background: "#0A1220"
    boxShadow: "0 1px 0 rgba(245, 224, 176, 0.22)"
  sidebar:
    background: "linear-gradient(180deg, #121E30 0%, #0A1220 100%)"
    boxShadow: "1px 0 0 rgba(245, 224, 176, 0.16), 8px 0 32px rgba(0, 0, 0, 0.50)"
  tab: {}
  backdrop:
    fillerOpacity: "0.045"
    fillerBlendMode: "difference"
  badge: {}
  progress:
    background: "#121E30"
  footer:
    background: "#0A1220"
    boxShadow: "0 -1px 0 rgba(245, 224, 176, 0.16)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Font override: force Inter (DM Sans looks pixelized on data pages) ──── */
  body,
  body *:not([class*="font-mono"]):not(code):not(pre):not(kbd):not(samp) {
    font-family: "Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif !important;
  }
  code, pre, kbd, samp, [class*="font-mono"], .font-mono-ui {
    font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace !important;
  }

  /* ── Warm depth atmosphere — golden-tinged navy, gentle vignette ──────────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 80% 10%, rgba(245, 224, 176, 0.06), transparent 40%),
      radial-gradient(circle at 20% 85%, rgba(102, 204, 255, 0.04), transparent 35%),
      radial-gradient(circle at 50% 60%, transparent 50%, #0A1220 115%),
      #0A1220;
  }

  /* ── Backdrop: custom background image with golden overlay ────────────────── */
  :root[style*="--theme-asset-bg"] {
    --component-backdrop-filler-opacity: 0.045;
    --component-backdrop-filler-blend-mode: difference;
    --component-backdrop-background-size: cover;
    --component-backdrop-background-position: center;
  }

  /* ── Nav active item: gold left rail ──────────────────────────────────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 3px solid #F5E0B0;   /* Thicker — more visible for elders */
    padding-left: calc(0.75rem - 3px);
    background: rgba(245, 224, 176, 0.08);
  }

  /* ── Chart bars: gold primary series with warm gold secondary glow ────────── */
  .recharts-wrapper .recharts-bar-rectangle path,
  .recharts-wrapper [class*="bar-"]:not([class*="progress\"]) rect {
    fill: #F5E0B0;
    filter: drop-shadow(0 0 6px rgba(245, 224, 176, 0.40));
  }

  .recharts-wrapper .recharts-line path,
  [class*="sparkline"] path,
  [class*="trend"] path {
    stroke: #F5E0B0;
    stroke-width: 2.5px;   /* Thicker lines — elder-friendly */
    filter: drop-shadow(0 0 6px rgba(245, 224, 176, 0.38));
  }

  /* ── Table / list row hover and selection ────────────────────────────────── */
  tr:hover td,
  [role="row"]:hover {
    background: rgba(245, 224, 176, 0.06) !important;
  }
  tr[aria-selected="true"] td,
  [role="row"][aria-selected="true"] {
    background: rgba(245, 224, 176, 0.12) !important;
    box-shadow: inset 3px 0 0 #F5E0B0;
  }

  /* ── Tabular numerics for KPIs, tables, cost ─────────────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  td,
  .cost-value {
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI values: warm cream + gold glow — high contrast, warm, readable ──── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  .cost-value {
    color: #F0E8D8 !important;
    font-weight: 600;          /* Heavier weight — elder readability */
    letter-spacing: 0.01em;
    text-shadow: 0 0 14px rgba(245, 224, 176, 0.22);
  }

  /* ── Card titles: warm mid-tone, comfortable contrast ────────────────────── */
  .card-title,
  [class*="CardTitle"] {
    color: #B8A890;
    font-size: 0.9375rem;      /* 15px — at baseSize floor, not below */
    font-weight: 600;
    letter-spacing: 0.02em;   /* Positive — open, elder-friendly */
  }

  /* ── Focus rings: thick 2px gold — WCAG 2.4.11 (AAA) compliant ──────────── */
  *:focus-visible {
    outline: 2px solid #F5E0B0;   /* 2px — elder-friendly thick ring */
    outline-offset: 3px;
    box-shadow: 0 0 0 2px rgba(245, 224, 176, 0.25), 0 0 16px rgba(245, 224, 176, 0.18);
  }

  /* ── Selection highlight ─────────────────────────────────────────────────── */
  ::selection {
    background: rgba(245, 224, 176, 0.28);
    color: #F0E8D8;
  }

  /* ── Scrollbar: thick 6px — elder-friendly grab target ───────────────────── */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(18, 30, 48, 0.60);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(245, 224, 176, 0.35);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(245, 224, 176, 0.55);
  }

  /* ── Loading / skeleton states ───────────────────────────────────────────── */
  [data-skeleton="true"],
  .skeleton,
  [class*="skeleton"] {
    background: #121E30;
    background-image: linear-gradient(90deg, #121E30 0%, rgba(245, 224, 176, 0.10) 50%, #121E30 100%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 2s infinite linear;
  }
  @keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Disabled states: clearly dimmed, not just color-shifted ─────────────── */
  [disabled],
  [aria-disabled="true"],
  .disabled {
    color: #4A4030 !important;
    opacity: 0.60;
    pointer-events: none;
  }

  /* ── Live badge: gold pulse — high contrast, shape+color dual cue ────────── */
  [data-variant="live"] {
    background: #F5E0B0 !important;
    color: #0A1220 !important;
    font-weight: 700 !important;
    box-shadow: 0 0 12px rgba(245, 224, 176, 0.60);
    animation: live-pulse 2s infinite;
  }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 rgba(245, 224, 176, 0.50); }
    70% { box-shadow: 0 0 0 10px rgba(245, 224, 176, 0); }
    100% { box-shadow: 0 0 0 0 rgba(245, 224, 176, 0); }
  }

  /* ── Progress bars: gold fill — consistent with primary accent ───────────── */
  [role="progressbar"] [class*="indicator"] {
    background: #F5E0B0 !important;
    box-shadow: 0 0 8px rgba(245, 224, 176, 0.45);
  }

  /* ── Success states: blue-teal (colorblind safe, not green) ──────────────── */
  [data-variant="success"],
  .text-success,
  [class*="success"] {
    color: #2DD4BF !important;
  }

  /* ── Destructive states: orange-red (not pure red, distinct from gold) ───── */
  [data-variant="destructive"],
  .text-destructive,
  [class*="destructive"]:not([class*="Foreground"]):not([class*="background"]) {
    color: #FF6B35 !important;
  }

    /* ── Wave 2: Bar chart — 3D gradient bars (Claude Code enhanced) ───────── */
  /* NOTE: These selectors target internal Tailwind classes (bg-[#ffe6cb], bg-emerald-500).
     They may break if the dashboard renames these classes in future updates. */
  @keyframes barGrowUp {
    from { transform: scaleY(0); opacity: 0.4; }
    to   { transform: scaleY(1); opacity: 1; }
  }

  /* Wave 1: Prefers-reduced-motion guard (WCAG 2.3.3) */
  @media (prefers-reduced-motion: reduce) {
    [class*="bg-[#ffe6cb]/70"],
    [class*="bg-emerald-500/70"] {
      animation: none !important;
    }
  }

  /* ── Gold input bars — fallback + 3D gradient ─────────────────────────── */
  [class*="bg-[#ffe6cb]"]:not([class*="/"]) {
    background-color: #F5E0B0 !important;
  }
  
  [class*="bg-[#ffe6cb]/70"] {
    position: relative;
    overflow: hidden;
    background: linear-gradient(
      to top,
      rgba(180, 160, 100, 1.0),
      rgba(245, 224, 176, 1.0) 40%,
      rgba(255, 244, 210, 1.0)
    );
    box-shadow:
      inset 2px 0 0 rgba(255, 244, 210, 0.45),
      inset -2px 0 0 rgba(100, 80, 40, 0.40),
      inset 0 2px 0 rgba(255, 244, 210, 0.35),
      0 3px 10px rgba(0, 0, 0, 0.40),
      0 0 8px rgba(245, 224, 176, 0.22);
    border-radius: 2px 2px 0 0;
    animation: barGrowUp 0.5s ease-out forwards;
    transform-origin: bottom;
    transition: filter 0.25s ease, box-shadow 0.25s ease;
  }
  /* Wave 3: Specular streak — light reflection on top 25% */
  
  [class*="bg-[#ffe6cb]/70"]::before {
    content: "";
    position: absolute;
    inset: 0 20% 75% 20%;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.18),
      transparent
    );
    border-radius: 0 0 50% 50%;
    pointer-events: none;
  }

  /* ── Teal output bars — fallback + 3D gradient ────────────────────────── */
  [class*="bg-emerald-500"]:not([class*="/"]) {
    background-color: #2DD4BF !important;
  }
  
  [class*="bg-emerald-500/70"] {
    position: relative;
    overflow: hidden;
    background: linear-gradient(
      to top,
      rgba(30, 160, 150, 1.0),
      rgba(45, 212, 191, 1.0) 40%,
      rgba(100, 255, 240, 1.0)
    );
    box-shadow:
      inset 2px 0 0 rgba(100, 255, 240, 0.35),
      inset -2px 0 0 rgba(20, 100, 95, 0.35),
      inset 0 2px 0 rgba(100, 255, 240, 0.28),
      0 3px 10px rgba(0, 0, 0, 0.40),
      0 0 8px rgba(45, 212, 191, 0.18);
    border-radius: 2px 2px 0 0;
    animation: barGrowUp 0.5s ease-out forwards;
    transform-origin: bottom;
    transition: filter 0.25s ease, box-shadow 0.25s ease;
  }
  /* Wave 3: Specular streak — light reflection on top 25% */
  
  [class*="bg-emerald-500/70"]::before {
    content: "";
    position: absolute;
    inset: 0 20% 75% 20%;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.14),
      transparent
    );
    border-radius: 0 0 50% 50%;
    pointer-events: none;
  }

  /* ── Bar hover: brighten + intensify glow (scoped to chart column) ────── */
  .group:hover > 
  .group:hover > [class*="bg-[#ffe6cb]/70"] {
    filter: brightness(1.15);
    box-shadow:
      inset 2px 0 0 rgba(255, 244, 210, 0.55),
      inset -2px 0 0 rgba(100, 80, 40, 0.45),
      inset 0 2px 0 rgba(255, 244, 210, 0.45),
      0 3px 14px rgba(0, 0, 0, 0.50),
      0 0 16px rgba(245, 224, 176, 0.35);
  }
  .group:hover > 
  .group:hover > [class*="bg-emerald-500/70"] {
    filter: brightness(1.12);
    box-shadow:
      inset 2px 0 0 rgba(100, 255, 240, 0.50),
      inset -2px 0 0 rgba(20, 100, 95, 0.45),
      inset 0 2px 0 rgba(100, 255, 240, 0.40),
      0 3px 14px rgba(0, 0, 0, 0.50),
      0 0 16px rgba(45, 212, 191, 0.30);
  }

  /* Legend swatches — Aureus palette */
  .h-2\.5.w-2\.5.bg-\[\#ffe6cb\] {
    background-color: #F5E0B0;
  }
  .h-2\.5.w-2\.5.bg-emerald-500 {
    background-color: #2DD4BF;
  }

  /* Table value colors */
  [class*="text-[#ffe6cb]"] {
    color: #F5E0B0;
  }
  .text-emerald-400 {
    color: #2DD4BF;
  }

  /* ── Wave 2: Chart tooltip — gold border + blur ─────────────────────────── */
  .bg-card.border.border-border.px-2\.5 {
    border-color: rgba(245, 224, 176, 0.30) !important;
    backdrop-filter: blur(8px);
    background: rgba(18, 30, 48, 0.95) !important;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.30);
  }

  /* ── Wave 2: Hardcoded amber text override ───────────────────────────────── */
  .text-amber-300\/80 {
    color: #D8C080 !important;
  }

  /* ── Wave 2: Source icons in Sessions — warm-tone fallback for oklch ─────── */
  [class*="source-icon"],
  [class*="SourceIcon"],
  [data-source-icon] {
    color: #D8C080 !important;
  }
  [class*="source-icon"][class*="oklch"],
  [class*="SourceIcon"][style*="oklch"],
  [data-source-icon][style*="oklch"] {
    color: #D8C080 !important;
  }

  /* ── Wave 2: Table value color overrides ─────────────────────────────────── */
  .text-\[\#ffe6cb\] {
    color: #F5E0B0 !important;
  }

  .text-emerald-400 {
    color: #2DD4BF;
  }

  /* ── Wave 1: Active filter gold fill (config, skills, all filter sidebars) ─ */
  [data-page="config"] aside button.bg-foreground\/10,
  aside button.bg-foreground\/10 {
    background: rgba(245, 224, 176, 0.12) !important;
    color: #F5E0B0 !important;
    border-left: 2px solid #F5E0B0;
    padding-left: calc(0.5rem - 2px);
  }

  /* ── Wave 1: Gold section dividers ──────────────────────────────────────── */
  .border-t.border-border {
    border-color: rgba(245, 224, 176, 0.20) !important;
  }
    /* ── Wave 3 ─────────────────────────────────────────────────────────────────── */

    /* 1. Error / warning prominence — orange left-border + faint glow */
    .bg-destructive\/10,
    [class*="bg-destructive/10"],
    [class*="bg-destructive\\/10"],
    [role="alert"] {
      border-left: 2px solid #FF6B35 !important;
      box-shadow: 0 0 8px rgba(255, 107, 53, 0.15);
    }

    .log-line[data-level="error"],
    .log-line[data-classification="error"],
    [data-log-level="error"],
    [data-classification="error"] {
      border-left: 2px solid #FF6B35;
      box-shadow: 0 0 6px rgba(255, 107, 53, 0.12);
    }

    /* 2. Cron job states — visual cue by badge variant inside cards */
    [class*="card"]:has([data-variant="success"]),
    [class*="Card"]:has([data-variant="success"]) {
      border-left: 3px solid #F5E0B0;
      box-shadow: inset 3px 0 8px -2px rgba(245, 224, 176, 0.18);
    }

    [class*="card"]:has([data-variant="warning"]),
    [class*="Card"]:has([data-variant="warning"]) {
      opacity: 0.7;
    }

    [class*="card"]:has([data-variant="destructive"]),
    [class*="Card"]:has([data-variant="destructive"]) {
      border-left: 3px solid #FF6B35;
      animation: destructive-pulse 2s infinite;
    }

    @keyframes destructive-pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.50); }
      70% { box-shadow: 0 0 0 8px rgba(255, 107, 53, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0); }
    }


