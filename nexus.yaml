name: nexus
label: Nexus
description: "Cool blue cyberpunk command center — high contrast, colorblind-safe, elder-friendly"

# ─── Palette ──────────────────────────────────────────────────────────────────
# All text/bg pairs verified WCAG AA (4.5:1) or AAA (7:1).
# Accent strategy: blue (primary) + amber (secondary) — safe for all colorblind types.
# No red/green semantic pairing. Custom background image (gold/blue glitter bokeh).
palette:
  background:
    hex: "#0A1628"    # Deep near-black navy — not pure black (halation risk)
    alpha: 1.0
  midground: "#E8F0FF"  # Cool off-white — ~13.94:1 on card, elder-friendly
  foreground:
    hex: "#2A8CFF"    # Electric blue — matches reference dominant
    alpha: 0.08
  warmGlow: "rgba(42, 140, 255, 0.12)"   # Blue glow — cohesive with accent
  noiseOpacity: 0.18   # Minimal grain — elders prefer clean surfaces

# ─── Typography ───────────────────────────────────────────────────────────────
# Inter: large x-height, open counters — best legibility at small sizes
# letterSpacing: positive — opens type for aging eyes
typography:
  fontSans: '"Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.02em"   # Positive — opens up type, elder-friendly

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.5rem"
  density: comfortable   # NOT compact — elders need generous tap targets

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
# Contrast ratios vs card bg (#12223A):
#   #2A8CFF blue:     ~4.78:1  ✓ AA
#   #F0A030 amber:    ~7.43:1  ✓ AAA
#   #E8F0FF cream:    ~13.94:1 ✓ AAA
#   #8A9BB5 sec text: ~5.65:1  ✓ AA
#   #8898B8 muted:    ~5.50:1  ✓ AA  (safe for elders)
#   #FF6B35 destr:    ~5.63:1  ✓ AA+ (orange-red, distinct from blue)
#   #2DD4BF success:  ~8.57:1  ✓ AAA (blue-teal — NOT green, colorblind safe)
colorOverrides:
  primary: "#2A8CFF"              # Electric blue — primary accent, chart glow
  primaryForeground: "#0A1628"
  accent: "#F0A030"               # Warm amber — secondary accent, contrast warmth
  accentForeground: "#0A1628"
  ring: "#2A8CFF"                 # Blue focus ring — thick 2px in customCSS
  success: "#2DD4BF"              # Blue-teal — NOT green (colorblind safe)
  successForeground: "#0A1628"
  warning: "#F0A030"              # Amber — same as accent; unambiguous
  warningForeground: "#0A1628"
  destructive: "#FF6B35"          # Orange-red — NOT pure red; distinct from blue
  destructiveForeground: "#E8F0FF"
  border: "rgba(42, 140, 255, 0.25)"   # Blue border — visible wireframe feel
  input: "rgba(10, 22, 40, 0.95)"
  muted: "rgba(10, 22, 40, 0.90)"
  mutedForeground: "#8898B8"      # 5.50:1 on card bg — passes AA
  card: "#12223A"                 # Dark blue — elevated surface
  cardForeground: "#E8F0FF"       # Cool off-white — 13.94:1 ✓ AAA
  secondary: "#162A44"            # Raised surface — between card and bg
  secondaryForeground: "#8A9BB5"  # Blue-gray — 5.65:1 ✓ AA
  popover: "#12223A"
  popoverForeground: "#E8F0FF"

# ─── Assets ───────────────────────────────────────────────────────────────────
# Custom background image: gold/blue glitter bokeh with shallow depth of field
assets:
  bg: "/ds-assets/011bg.png"

# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, #162A44 0%, #12223A 100%)"
    boxShadow: "inset 0 0 0 1px rgba(42, 140, 255, 0.18), 0 2px 16px rgba(0, 0, 0, 0.40)"
  header:
    background: "#0A1628"
    boxShadow: "0 1px 0 rgba(42, 140, 255, 0.22)"
  sidebar:
    background: "linear-gradient(180deg, #12223A 0%, #0A1628 100%)"
    boxShadow: "1px 0 0 rgba(42, 140, 255, 0.16), 8px 0 32px rgba(0, 0, 0, 0.50)"
  tab: {}
  backdrop:
    fillerOpacity: "0.045"
    fillerBlendMode: "difference"
  badge: {}
  progress:
    background: "#12223A"
  footer:
    background: "#0A1628"
    boxShadow: "0 -1px 0 rgba(42, 140, 255, 0.16)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Cool depth atmosphere — blue-tinged navy, gentle vignette ────────────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 80% 10%, rgba(42, 140, 255, 0.06), transparent 40%),
      radial-gradient(circle at 20% 85%, rgba(240, 160, 48, 0.04), transparent 35%),
      radial-gradient(circle at 50% 60%, transparent 50%, #0A1628 115%),
      #0A1628;
  }

  /* ── Backdrop: custom background image with blue overlay ──────────────────── */
  :root[style*="--theme-asset-bg"] {
    --component-backdrop-filler-opacity: 0.045;
    --component-backdrop-filler-blend-mode: difference;
    --component-backdrop-background-size: cover;
    --component-backdrop-background-position: center;
  }

  /* ── Nav active item: blue left rail ──────────────────────────────────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 3px solid #2A8CFF;   /* Thicker — more visible for elders */
    padding-left: calc(0.75rem - 3px);
    background: rgba(42, 140, 255, 0.08);
  }

  /* ── Chart bars: blue primary series with amber secondary glow ────────────── */
  .recharts-wrapper .recharts-bar-rectangle path,
  .recharts-wrapper [class*="bar-"]:not([class*="progress\"]) rect {
    fill: #2A8CFF;
    filter: drop-shadow(0 0 6px rgba(42, 140, 255, 0.40));
  }

  .recharts-wrapper .recharts-line path,
  [class*="sparkline"] path,
  [class*="trend"] path {
    stroke: #50B0FF;
    stroke-width: 2.5px;   /* Thicker lines — elder-friendly */
    filter: drop-shadow(0 0 6px rgba(80, 176, 255, 0.38));
  }

  /* ── Table / list row hover and selection ────────────────────────────────── */
  tr:hover td,
  [role="row"]:hover {
    background: rgba(42, 140, 255, 0.06) !important;
  }
  tr[aria-selected="true"] td,
  [role="row"][aria-selected="true"] {
    background: rgba(42, 140, 255, 0.12) !important;
    box-shadow: inset 3px 0 0 #2A8CFF;
  }

  /* ── Tabular numerics for KPIs, tables, cost ─────────────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  td,
  .cost-value {
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI values: cool white + blue glow — high contrast, crisp, readable ─── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  .cost-value {
    color: #E8F0FF !important;
    font-weight: 600;          /* Heavier weight — elder readability */
    letter-spacing: 0.01em;
    text-shadow: 0 0 14px rgba(42, 140, 255, 0.22);
  }

  /* ── Card titles: blue mid-tone, comfortable contrast ────────────────────── */
  .card-title,
  [class*="CardTitle"] {
    color: #8A9BB5;
    font-size: 0.9375rem;      /* 15px — at baseSize floor, not below */
    font-weight: 600;
    letter-spacing: 0.02em;   /* Positive — open, elder-friendly */
  }

  /* ── Focus rings: thick 2px blue — WCAG 2.4.11 (AAA) compliant ──────────── */
  *:focus-visible {
    outline: 2px solid #2A8CFF;   /* 2px — elder-friendly thick ring */
    outline-offset: 3px;
    box-shadow: 0 0 0 2px rgba(42, 140, 255, 0.25), 0 0 16px rgba(42, 140, 255, 0.18);
  }

  /* ── Selection highlight ─────────────────────────────────────────────────── */
  ::selection {
    background: rgba(42, 140, 255, 0.28);
    color: #E8F0FF;
  }

  /* ── Scrollbar: thick 6px — elder-friendly grab target ───────────────────── */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(18, 34, 58, 0.60);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(42, 140, 255, 0.45);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(42, 140, 255, 0.75);
  }

  /* ── Loading / skeleton states ───────────────────────────────────────────── */
  [data-skeleton="true"],
  .skeleton,
  [class*="skeleton"] {
    background: #12223A;
    background-image: linear-gradient(90deg, #12223A 0%, rgba(42, 140, 255, 0.10) 50%, #12223A 100%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 2s infinite linear;
  }
  @keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Disabled states: clearly dimmed, not just color-shifted ─────────────── */
  [disabled],
  [aria-disabled="true"],
  .disabled {
    color: #3A4A62 !important;
    opacity: 0.60;
    pointer-events: none;
  }

  /* ── Live badge: blue pulse — high contrast, shape+color dual cue ────────── */
  [data-variant="live"] {
    background: #2A8CFF !important;
    color: #0A1628 !important;
    font-weight: 700 !important;
    box-shadow: 0 0 12px rgba(42, 140, 255, 0.60);
    animation: live-pulse 2s infinite;
  }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 rgba(42, 140, 255, 0.50); }
    70% { box-shadow: 0 0 0 10px rgba(42, 140, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(42, 140, 255, 0); }
  }

  /* ── Progress bars: blue fill — consistent with primary accent ───────────── */
  [role="progressbar"] [class*="indicator"] {
    background: #2A8CFF !important;
    box-shadow: 0 0 8px rgba(42, 140, 255, 0.45);
  }

  /* ── Success states: blue-teal (colorblind safe, not green) ──────────────── */
  [data-variant="success"],
  .text-success,
  [class*="success"] {
    color: #2DD4BF !important;
  }

  /* ── Destructive states: orange-red (not pure red, distinct from blue) ───── */
  [data-variant="destructive"],
  .text-destructive,
  [class*="destructive"]:not([class*="Foreground"]):not([class*="background"]) {
    color: #FF6B35 !important;
  }
