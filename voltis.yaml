name: voltis
label: Voltis
description: "Deep teal command center – electric cyan chrome, amber-gold KPI peaks"

# ─── Palette ──────────────────────────────────────────────────────────────────
palette:
  background:
    hex: "#0A1A1F"    # vision base; nests measured #0A1E28 / #0A2832 family
    alpha: 1.0
  midground: "#A8D8DC"  # pale teal-cyan — primary chrome & secondary text
  foreground:
    hex: "#00E5FF"    # electric cyan accent layer
    alpha: 0.10       # subtle ambient; pinned brighter in overrides/CSS
  warmGlow: "rgba(255, 208, 0, 0.16)"   # amber-gold dashboard bloom
  noiseOpacity: 0.42   # polished grain — premium not gritty

# ─── Typography ───────────────────────────────────────────────────────────────
typography:
  fontSans: '"Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0"

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.5rem"
  density: compact

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
colorOverrides:
  primary: "#00E5FF"             # electric cyan CTA / focus
  primaryForeground: "#0A1A1F"
  accent: "#33EBFF"              # brighter cyan — high-energy data / alerts
  accentForeground: "#0A1A1F"
  ring: "#00E5FF"
  success: "#00E5B8"             # teal-cyan mint — positive operations
  warning: "#E6C85A"             # measured warm amber
  destructive: "#FF4D6A"         # vivid pink-red — critical alerts
  destructiveForeground: "#E8F4F4"
  border: "rgba(0, 229, 255, 0.15)"
  input: "rgba(13, 34, 40, 0.90)"
  muted: "rgba(10, 26, 31, 0.88)"
  mutedForeground: "#6A9EA8"
  card: "#0D2228"
  cardForeground: "#E0F0F0"
  secondary: "#144650"
  secondaryForeground: "#A8D8DC"
  popover: "#0D2228"
  popoverForeground: "#E0F0F0"

# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, #1E5A64 0%, #0D2228 100%)"
    boxShadow: "inset 0 0 0 1px rgba(0, 229, 255, 0.12), 0 0 20px rgba(0, 229, 255, 0.05)"
  header:
    background: "#0A1A1F"
    boxShadow: "0 1px 0 rgba(0, 229, 255, 0.18), 0 0 36px rgba(0, 229, 255, 0.06)"
  sidebar:
    background: "linear-gradient(180deg, #0D2228 0%, #0A1A1F 100%)"
    boxShadow: "1px 0 0 rgba(0, 229, 255, 0.10), 12px 0 44px rgba(0, 0, 0, 0.38)"
  tab: {}
  backdrop: {}
  badge: {}
  progress:
    background: "#0D2228"
  footer:
    background: "#0A1A1F"
    boxShadow: "0 -1px 0 rgba(0, 229, 255, 0.12)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Cinematic dashboard atmosphere: teal depth + amber vignette ───────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 85% 15%, rgba(0, 229, 255, 0.08), transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(255, 208, 0, 0.06), transparent 35%),
      radial-gradient(circle at 50% 70%, transparent 45%, #0A1A1F 110%),
      #0A1A1F;
  }

  /* ── Fine screen grain + faint cyan scanline ────────────────────────────── */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2; /* below modals/overlays */
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 229, 255, 0.012) 4px,
        rgba(0, 229, 255, 0.012) 5px
      ),
      radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    background-size: auto, 3px 3px;
    opacity: 0.42;
    mix-blend-mode: screen;
  }

  /* ── Nav active item: cyan rail with amber undertone ───────────────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 2px solid #00E5FF;
    padding-left: calc(0.75rem - 2px);
    background: linear-gradient(90deg, rgba(0, 229, 255, 0.10), rgba(255, 208, 0, 0.04));
    box-shadow: inset 8px 0 24px rgba(0, 229, 255, 0.06);
  }

  /* ── Chart bars: steel-blue base (#1E90FF) with amber peak glow ────────── */
  /* Bars render as SVG paths/rects — gradient is approximated via layered
     drop-shadow so the top of each bar blooms warm gold against the cool base. */
  .recharts-wrapper .recharts-bar-rectangle path,
  .recharts-wrapper [class*="bar-"]:not([class*="progress"]) rect {
    fill: #1E90FF;
    filter: drop-shadow(0 0 8px rgba(30, 144, 255, 0.35))
            drop-shadow(0 -2px 6px rgba(255, 208, 0, 0.25));
    opacity: 0.95;
  }

  .recharts-wrapper .recharts-line path,
  [class*="sparkline"] path,
  [class*="trend"] path {
    stroke: #00E5FF;
    filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.38));
  }

  /* ── Table / list row hover and selected states ─────────────────────────── */
  tr:hover td,
  [role="row"]:hover {
    background: rgba(0, 229, 255, 0.05) !important;
  }
  tr[aria-selected="true"] td,
  [role="row"][aria-selected="true"] {
    background: rgba(0, 229, 255, 0.08) !important;
    box-shadow: inset 3px 0 0 #00E5FF;
  }

  /* ── Tabular numerics for KPIs, tables, and cost readouts ───────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  td,
  .cost-value {
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI values: amber-gold with warm glow ──────────────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  .cost-value {
    color: #FFD000 !important;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-shadow: 0 0 12px rgba(255, 208, 0, 0.30);
  }

  /* ── Card headings: muted teal labels that recede behind data ───────────── */
  .card-title,
  [class*="CardTitle"] {
    color: #6A9EA8;
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* ── Focus rings: accessible cyan with electric bloom ───────────────────── */
  *:focus-visible {
    outline: 1.5px solid #00E5FF;
    outline-offset: 2px;
    box-shadow: 0 0 0 1px rgba(0, 229, 255, 0.30), 0 0 24px rgba(51, 235, 255, 0.22);
  }

  /* ── Selection highlight ───────────────────────────────────────────────── */
  ::selection {
    background: rgba(0, 229, 255, 0.25);
    color: #E0F0F0;
  }

  /* ── Scrollbar: thin cyan-teal ──────────────────────────────────────────── */
  ::-webkit-scrollbar {
    width: 4px;
    height: 4px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(0, 229, 255, 0.35);
    border-radius: 2px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(51, 235, 255, 0.65);
  }

  /* ── Loading / skeleton states ──────────────────────────────────────────── */
  [data-skeleton="true"],
  .skeleton,
  [class*="skeleton"] {
    background: #0D2228;
    background-image: linear-gradient(90deg, #0D2228 0%, rgba(0, 229, 255, 0.12) 50%, #0D2228 100%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 2s infinite linear;
  }
  @keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Disabled states ────────────────────────────────────────────────────── */
  [disabled],
  [aria-disabled="true"],
  .disabled {
    color: #3A5A64 !important;
    opacity: 0.60;
    pointer-events: none;
  }

  /* ── Live badge: amber pulse emphasis ───────────────────────────────────── */
  [data-variant="live"] {
    background: #FFD000 !important;
    color: #0A1A1F !important;
    box-shadow: 0 0 10px rgba(255, 208, 0, 0.55);
    animation: live-pulse 2s infinite;
  }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 208, 0, 0.45); }
    70% { box-shadow: 0 0 0 10px rgba(255, 208, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 208, 0, 0); }
  }

  /* ── Progress bars: electric cyan fill ──────────────────────────────────── */
  [role="progressbar"] [class*="indicator"] {
    background: #00E5FF !important;
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.45);
  }
