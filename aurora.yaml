name: aurora
label: Aurora
description: "Electric cyan aurora command center — high contrast, colorblind-safe, elder-friendly"

# ─── Palette ──────────────────────────────────────────────────────────────────
# All text/bg pairs verified WCAG AA (4.5:1) or AAA (7:1).
# Accent strategy: cyan (primary) + gold (secondary) — safe for all colorblind types.
# No red/green semantic pairing. Custom background image (aurora night sky).
palette:
  background:
    hex: "#050A14"    # Deep near-black blue — not pure black (halation risk)
    alpha: 1.0
  midground: "#F0F4FF"  # Cool off-white — ~15.85:1 on card, elder-friendly
  foreground:
    hex: "#00B4FF"    # Electric cyan — matches reference dominant
    alpha: 0.08
  warmGlow: "rgba(0, 180, 255, 0.12)"   # Cyan glow — cohesive with accent
  noiseOpacity: 0.18   # Minimal grain — elders prefer clean surfaces

# ─── Typography ───────────────────────────────────────────────────────────────
# Inter: large x-height, open counters — best legibility at small sizes
# letterSpacing: positive — opens type for aging eyes
typography:
  fontSans: '"Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.02em"   # Positive — opens up type, elder-friendly

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.5rem"
  density: comfortable   # NOT compact — elders need generous tap targets

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
# Contrast ratios vs card bg (#0D1A2E):
#   #00B4FF cyan:     ~7.45:1  ✓ AAA
#   #FFD060 gold:     ~11.99:1 ✓ AAA
#   #F0F4FF cream:    ~15.85:1 ✓ AAA
#   #8A9BB5 sec text: ~6.17:1  ✓ AA
#   #8898B8 muted:    ~6.00:1  ✓ AA  (safe for elders)
#   #FF6B35 destr:    ~6.15:1  ✓ AA+ (orange-red, distinct from cyan)
#   #2DD4BF success:  ~9.37:1  ✓ AAA (blue-teal — NOT green, colorblind safe)
colorOverrides:
  primary: "#00B4FF"              # Electric cyan — primary accent, chart glow
  primaryForeground: "#050A14"
  accent: "#FFD060"               # Warm gold — secondary accent, star warmth
  accentForeground: "#050A14"
  ring: "#00B4FF"                 # Cyan focus ring — thick 2px in customCSS
  success: "#2DD4BF"              # Blue-teal — NOT green (colorblind safe)
  successForeground: "#050A14"
  warning: "#FFD060"              # Gold — same as accent; unambiguous
  warningForeground: "#050A14"
  destructive: "#FF6B35"          # Orange-red — NOT pure red; distinct from cyan
  destructiveForeground: "#F0F4FF"
  border: "rgba(0, 180, 255, 0.25)"   # Cyan border — visible aurora feel
  input: "rgba(5, 10, 20, 0.95)"
  muted: "rgba(5, 10, 20, 0.90)"
  mutedForeground: "#8898B8"      # 6.00:1 on card bg — passes AA
  card: "#0D1A2E"                 # Dark navy blue — elevated surface
  cardForeground: "#F0F4FF"       # Cool off-white — 15.85:1 ✓ AAA
  secondary: "#111E36"            # Raised surface — between card and bg
  secondaryForeground: "#8A9BB5"  # Blue-gray — 6.17:1 ✓ AA
  popover: "#0D1A2E"
  popoverForeground: "#F0F4FF"

# ─── Assets ───────────────────────────────────────────────────────────────────
# Custom background image: aurora night sky with electric blue, violet, stars
assets:
  bg: "/ds-assets/012bg.png"

# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, #111E36 0%, #0D1A2E 100%)"
    boxShadow: "inset 0 0 0 1px rgba(0, 180, 255, 0.18), 0 2px 16px rgba(0, 0, 0, 0.40)"
  header:
    background: "#050A14"
    boxShadow: "0 1px 0 rgba(0, 180, 255, 0.22)"
  sidebar:
    background: "linear-gradient(180deg, #0D1A2E 0%, #050A14 100%)"
    boxShadow: "1px 0 0 rgba(0, 180, 255, 0.16), 8px 0 32px rgba(0, 0, 0, 0.50)"
  tab: {}
  backdrop:
    fillerOpacity: "0.045"
    fillerBlendMode: "difference"
  badge: {}
  progress:
    background: "#0D1A2E"
  footer:
    background: "#050A14"
    boxShadow: "0 -1px 0 rgba(0, 180, 255, 0.16)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Aurora depth atmosphere — cyan-tinged darkness, gentle vignette ──────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 80% 10%, rgba(0, 180, 255, 0.06), transparent 40%),
      radial-gradient(circle at 20% 85%, rgba(255, 208, 96, 0.04), transparent 35%),
      radial-gradient(circle at 50% 60%, transparent 50%, #050A14 115%),
      #050A14;
  }

  /* ── Backdrop: custom background image with aurora overlay ────────────────── */
  :root[style*="--theme-asset-bg"] {
    --component-backdrop-filler-opacity: 0.045;
    --component-backdrop-filler-blend-mode: difference;
    --component-backdrop-background-size: cover;
    --component-backdrop-background-position: center;
  }

  /* ── Nav active item: cyan left rail ──────────────────────────────────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 3px solid #00B4FF;   /* Thicker — more visible for elders */
    padding-left: calc(0.75rem - 3px);
    background: rgba(0, 180, 255, 0.08);
  }

  /* ── Chart bars: cyan primary series with gold secondary glow ─────────────── */
  .recharts-wrapper .recharts-bar-rectangle path,
  .recharts-wrapper [class*="bar-"]:not([class*="progress\"]) rect {
    fill: #00B4FF;
    filter: drop-shadow(0 0 6px rgba(0, 180, 255, 0.40));
  }

  .recharts-wrapper .recharts-line path,
  [class*="sparkline"] path,
  [class*="trend"] path {
    stroke: #00B4FF;
    stroke-width: 2.5px;   /* Thicker lines — elder-friendly */
    filter: drop-shadow(0 0 6px rgba(0, 180, 255, 0.38));
  }

  /* ── Table / list row hover and selection ────────────────────────────────── */
  tr:hover td,
  [role="row"]:hover {
    background: rgba(0, 180, 255, 0.06) !important;
  }
  tr[aria-selected="true"] td,
  [role="row"][aria-selected="true"] {
    background: rgba(0, 180, 255, 0.12) !important;
    box-shadow: inset 3px 0 0 #00B4FF;
  }

  /* ── Tabular numerics for KPIs, tables, cost ─────────────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  td,
  .cost-value {
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI values: cool white + cyan glow — high contrast, aurora, readable ── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  .cost-value {
    color: #F0F4FF !important;
    font-weight: 600;          /* Heavier weight — elder readability */
    letter-spacing: 0.01em;
    text-shadow: 0 0 14px rgba(0, 180, 255, 0.22);
  }

  /* ── Card titles: blue mid-tone, comfortable contrast ────────────────────── */
  .card-title,
  [class*="CardTitle"] {
    color: #8A9BB5;
    font-size: 0.9375rem;      /* 15px — at baseSize floor, not below */
    font-weight: 600;
    letter-spacing: 0.02em;   /* Positive — open, elder-friendly */
  }

  /* ── Focus rings: thick 2px cyan — WCAG 2.4.11 (AAA) compliant ──────────── */
  *:focus-visible {
    outline: 2px solid #00B4FF;   /* 2px — elder-friendly thick ring */
    outline-offset: 3px;
    box-shadow: 0 0 0 2px rgba(0, 180, 255, 0.25), 0 0 16px rgba(0, 180, 255, 0.18);
  }

  /* ── Selection highlight ─────────────────────────────────────────────────── */
  ::selection {
    background: rgba(0, 180, 255, 0.28);
    color: #F0F4FF;
  }

  /* ── Scrollbar: thick 6px — elder-friendly grab target ───────────────────── */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(13, 26, 46, 0.60);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(0, 180, 255, 0.45);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 180, 255, 0.75);
  }

  /* ── Loading / skeleton states ───────────────────────────────────────────── */
  [data-skeleton="true"],
  .skeleton,
  [class*="skeleton"] {
    background: #0D1A2E;
    background-image: linear-gradient(90deg, #0D1A2E 0%, rgba(0, 180, 255, 0.10) 50%, #0D1A2E 100%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 2s infinite linear;
  }
  @keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Disabled states: clearly dimmed, not just color-shifted ─────────────── */
  [disabled],
  [aria-disabled="true"],
  .disabled {
    color: #3A4A62 !important;
    opacity: 0.60;
    pointer-events: none;
  }

  /* ── Live badge: cyan pulse — high contrast, shape+color dual cue ────────── */
  [data-variant="live"] {
    background: #00B4FF !important;
    color: #050A14 !important;
    font-weight: 700 !important;
    box-shadow: 0 0 12px rgba(0, 180, 255, 0.60);
    animation: live-pulse 2s infinite;
  }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 rgba(0, 180, 255, 0.50); }
    70% { box-shadow: 0 0 0 10px rgba(0, 180, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 180, 255, 0); }
  }

  /* ── Progress bars: cyan fill — consistent with primary accent ───────────── */
  [role="progressbar"] [class*="indicator"] {
    background: #00B4FF !important;
    box-shadow: 0 0 8px rgba(0, 180, 255, 0.45);
  }

  /* ── Success states: blue-teal (colorblind safe, not green) ──────────────── */
  [data-variant="success"],
  .text-success,
  [class*="success"] {
    color: #2DD4BF !important;
  }

  /* ── Destructive states: orange-red (not pure red, distinct from cyan) ───── */
  [data-variant="destructive"],
  .text-destructive,
  [class*="destructive"]:not([class*="Foreground"]):not([class*="background"]) {
    color: #FF6B35 !important;
  }
