name: luminos
label: Luminos
description: "Warm amber-gold command center — high contrast, colorblind-safe, elder-friendly"

# ─── Palette ──────────────────────────────────────────────────────────────────
# All text/bg pairs verified WCAG AA (4.5:1) or AAA (7:1).
# Accent strategy: amber/gold (primary) + blue-teal (success) — warm but accessible.
# No red/green semantic pairing. Custom background image (dark navy + golden portal).
palette:
  background:
    hex: "#100E0A"    # Warm near-black — not pure black (halation risk for elders)
    alpha: 1.0
  midground: "#F5E6C8"  # Warm pale gold — ~14.7:1 on card, elder-friendly
  foreground:
    hex: "#F0C860"    # Amber/gold accent glow layer — matches reference dominant
    alpha: 0.08
  warmGlow: "rgba(240, 200, 96, 0.14)"   # Golden warmth — cohesive with accent
  noiseOpacity: 0.18   # Minimal grain — elders prefer clean surfaces

# ─── Typography ───────────────────────────────────────────────────────────────
# Inter: large x-height, open counters — best legibility at small sizes
# letterSpacing: positive — opens type for aging eyes
typography:
  fontSans: '"Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.02em"   # Positive — opens up type, elder-friendly

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.5rem"
  density: comfortable   # NOT compact — elders need generous tap targets

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
# Contrast ratios vs card bg (#1A1510):
#   #F0C860 amber:    ~11.34:1 ✓ AAA
#   #2DD4BF success:  ~9.74:1  ✓ AAA (blue-teal — NOT green)
#   #F5E6C8 cream:    ~14.70:1 ✓ AAA
#   #C8B898 sec text: ~9.29:1  ✓ AAA
#   #9A8D7A muted:    ~5.58:1  ✓ AA  (safe for elders)
#   #FF6B35 destr:    ~6.39:1  ✓ AA+ (orange-red, distinct from amber)
colorOverrides:
  primary: "#F0C860"              # Amber/gold — primary CTA, active states
  primaryForeground: "#100E0A"
  accent: "#E89830"               # Bronze — secondary warmth, deeper accent
  accentForeground: "#100E0A"
  ring: "#F0C860"                 # Gold focus ring — thick 2px in customCSS
  success: "#2DD4BF"              # Blue-teal — NOT green (colorblind safe)
  successForeground: "#100E0A"
  warning: "#F0C860"              # Amber — same as primary; unambiguous
  warningForeground: "#100E0A"
  destructive: "#FF6B35"          # Orange-red — NOT pure red; distinct from amber
  destructiveForeground: "#F5E6C8"
  border: "rgba(240, 200, 96, 0.28)"   # Gold border — visible at a glance
  input: "rgba(16, 14, 10, 0.95)"
  muted: "rgba(16, 14, 10, 0.90)"
  mutedForeground: "#9A8D7A"      # 5.58:1 on card bg — passes AA
  card: "#1A1510"                 # Warm dark brown-black — elevated surface
  cardForeground: "#F5E6C8"       # Warm pale gold — 14.7:1 ✓ AAA
  secondary: "#221E18"            # Raised surface — between card and bg
  secondaryForeground: "#C8B898"  # Warm mid-tone — 9.29:1 ✓ AAA
  popover: "#1A1510"
  popoverForeground: "#F5E6C8"

# ─── Assets ───────────────────────────────────────────────────────────────────
# Custom background image: dark navy illustration with golden portal
assets:
  bg: "/ds-assets/006bg.png"

# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, #221E18 0%, #1A1510 100%)"
    boxShadow: "inset 0 0 0 1px rgba(240, 200, 96, 0.18), 0 2px 16px rgba(0, 0, 0, 0.40)"
  header:
    background: "#100E0A"
    boxShadow: "0 1px 0 rgba(240, 200, 96, 0.22)"
  sidebar:
    background: "linear-gradient(180deg, #1A1510 0%, #100E0A 100%)"
    boxShadow: "1px 0 0 rgba(240, 200, 96, 0.16), 8px 0 32px rgba(0, 0, 0, 0.50)"
  tab: {}
  backdrop:
    fillerOpacity: "0.045"
    fillerBlendMode: "difference"
  badge: {}
  progress:
    background: "#1A1510"
  footer:
    background: "#100E0A"
    boxShadow: "0 -1px 0 rgba(240, 200, 96, 0.16)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Warm depth atmosphere — golden-tinged darkness, gentle vignette ─────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 80% 10%, rgba(240, 200, 96, 0.06), transparent 40%),
      radial-gradient(circle at 20% 85%, rgba(232, 152, 48, 0.04), transparent 35%),
      radial-gradient(circle at 50% 60%, transparent 50%, #100E0A 115%),
      #100E0A;
  }

  /* ── Backdrop: custom background image with golden overlay ────────────────── */
  /* The theme's assets.bg provides the image; we tune the compositing here */
  :root[style*="--theme-asset-bg"] {
    --component-backdrop-filler-opacity: 0.045;
    --component-backdrop-filler-blend-mode: difference;
    --component-backdrop-background-size: cover;
    --component-backdrop-background-position: center;
  }

  /* ── Nav active item: gold left rail ──────────────────────────────────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 3px solid #F0C860;   /* Thicker — more visible for elders */
    padding-left: calc(0.75rem - 3px);
    background: rgba(240, 200, 96, 0.08);
  }

  /* ── Chart bars: gold primary series with bronze secondary glow ───────────── */
  .recharts-wrapper .recharts-bar-rectangle path,
  .recharts-wrapper [class*="bar-"]:not([class*="progress\"]) rect {
    fill: #F0C860;
    filter: drop-shadow(0 0 6px rgba(240, 200, 96, 0.40));
  }

  .recharts-wrapper .recharts-line path,
  [class*="sparkline"] path,
  [class*="trend"] path {
    stroke: #F0C860;
    stroke-width: 2.5px;   /* Thicker lines — elder-friendly */
    filter: drop-shadow(0 0 6px rgba(240, 200, 96, 0.38));
  }

  /* ── Table / list row hover and selection ────────────────────────────────── */
  tr:hover td,
  [role="row"]:hover {
    background: rgba(240, 200, 96, 0.06) !important;
  }
  tr[aria-selected="true"] td,
  [role="row"][aria-selected="true"] {
    background: rgba(240, 200, 96, 0.12) !important;
    box-shadow: inset 3px 0 0 #F0C860;
  }

  /* ── Tabular numerics for KPIs, tables, cost ─────────────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  td,
  .cost-value {
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI values: warm cream + gold glow — high contrast, warm, readable ──── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  .cost-value {
    color: #F5E6C8 !important;
    font-weight: 600;          /* Heavier weight — elder readability */
    letter-spacing: 0.01em;
    text-shadow: 0 0 14px rgba(240, 200, 96, 0.22);
  }

  /* ── Card titles: warm mid-tone, comfortable contrast ────────────────────── */
  .card-title,
  [class*="CardTitle"] {
    color: #C8B898;
    font-size: 0.9375rem;      /* 15px — at baseSize floor, not below */
    font-weight: 600;
    letter-spacing: 0.02em;   /* Positive — open, elder-friendly */
  }

  /* ── Focus rings: thick 2px gold — WCAG 2.4.11 (AAA) compliant ──────────── */
  *:focus-visible {
    outline: 2px solid #F0C860;   /* 2px — elder-friendly thick ring */
    outline-offset: 3px;
    box-shadow: 0 0 0 2px rgba(240, 200, 96, 0.25), 0 0 16px rgba(240, 200, 96, 0.18);
  }

  /* ── Selection highlight ─────────────────────────────────────────────────── */
  ::selection {
    background: rgba(240, 200, 96, 0.28);
    color: #F5E6C8;
  }

  /* ── Scrollbar: thick 6px — elder-friendly grab target ───────────────────── */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(26, 21, 16, 0.60);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(240, 200, 96, 0.45);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(240, 200, 96, 0.75);
  }

  /* ── Loading / skeleton states ───────────────────────────────────────────── */
  [data-skeleton="true"],
  .skeleton,
  [class*="skeleton"] {
    background: #1A1510;
    background-image: linear-gradient(90deg, #1A1510 0%, rgba(240, 200, 96, 0.10) 50%, #1A1510 100%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 2s infinite linear;
  }
  @keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Disabled states: clearly dimmed, not just color-shifted ─────────────── */
  [disabled],
  [aria-disabled="true"],
  .disabled {
    color: #4A4030 !important;
    opacity: 0.60;
    pointer-events: none;
  }

  /* ── Live badge: gold pulse — high contrast, shape+color dual cue ────────── */
  [data-variant="live"] {
    background: #F0C860 !important;
    color: #100E0A !important;
    font-weight: 700 !important;
    box-shadow: 0 0 12px rgba(240, 200, 96, 0.60);
    animation: live-pulse 2s infinite;
  }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 rgba(240, 200, 96, 0.50); }
    70% { box-shadow: 0 0 0 10px rgba(240, 200, 96, 0); }
    100% { box-shadow: 0 0 0 0 rgba(240, 200, 96, 0); }
  }

  /* ── Progress bars: gold fill — consistent with primary accent ───────────── */
  [role="progressbar"] [class*="indicator"] {
    background: #F0C860 !important;
    box-shadow: 0 0 8px rgba(240, 200, 96, 0.45);
  }

  /* ── Success states: blue-teal (colorblind safe, not green) ──────────────── */
  [data-variant="success"],
  .text-success,
  [class*="success"] {
    color: #2DD4BF !important;
  }

  /* ── Destructive states: orange-red (not pure red, distinct from amber) ──── */
  [data-variant="destructive"],
  .text-destructive,
  [class*="destructive"]:not([class*="Foreground"]):not([class*="background"]) {
    color: #FF6B35 !important;
  }
