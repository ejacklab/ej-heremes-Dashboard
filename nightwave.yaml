name: nightwave
label: Nightwave
description: Near-black navy with steel-blue chrome and icy cyan – trading terminal vibes

# ─── Palette ──────────────────────────────────────────────────────────────────
# Background = navy-black screen depth, midground = cool white-blue text/chrome,
# foreground = cyan data light with amber warmth supplied through overrides/CSS.
palette:
  background:
    hex: "#050B12"    # readable navy-black base; less flat than pure black
    alpha: 1.0
  midground: "#B9D4F2"  # pale blue — primary chrome + secondary text family
  foreground:
    hex: "#65C8FF"    # active cyan — chart light / focus / selected states
    alpha: 0.10       # ambient layer; brighter accents pinned below
  warmGlow: "rgba(242, 122, 0, 0.34)"   # orange market-signal bloom for the dashboard backdrop
  noiseOpacity: 0.48   # cinematic grain multiplier without muddying data

# ─── Typography ───────────────────────────────────────────────────────────────
typography:
  fontSans: '"Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif'
  fontMono: '"IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace'
  fontDisplay: '"Inter", "SF Pro Display", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
  baseSize: "14px"
  lineHeight: "1.55"
  letterSpacing: "0"

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.375rem"    # glass cards: slightly softer than Lux/Bastion
  density: compact

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
colorOverrides:
  primary: "#65C8FF"             # active cyan CTA / focus color
  primaryForeground: "#020408"
  accent: "#FF9100"              # vivid amber for high-energy data / alerts
  accentForeground: "#020408"
  ring: "#65C8FF"
  success: "#7DFFDA"             # cool mint; image has little green, keep subtle
  warning: "#FFB326"             # amber warning derived from warm bloom
  destructive: "#FF6B2A"         # orange-red error that still fits palette
  destructiveForeground: "#020408"
  border: "rgba(88, 152, 200, 0.36)"   # steel-blue panel edge
  input: "rgba(14, 31, 53, 0.88)"      # #0E1F35 raised field surface
  muted: "rgba(9, 16, 32, 0.86)"       # #091020 glass panel well
  mutedForeground: "#7F9DBA"           # AA-safe muted text on dark base
  card: "#091020"
  cardForeground: "#F3F8FF"
  secondary: "#0E1F35"
  secondaryForeground: "#B9D4F2"
  popover: "#0E1F35"
  popoverForeground: "#F3F8FF"

# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, rgba(14, 31, 53, 0.86), rgba(5, 11, 18, 0.94))"
    boxShadow: "inset 0 0 0 1px rgba(88, 152, 200, 0.32), inset 0 1px 0 rgba(168, 216, 248, 0.08), 0 18px 56px rgba(0, 0, 0, 0.58), 0 0 42px rgba(45, 143, 232, 0.10)"
  header:
    background: "linear-gradient(180deg, rgba(9, 16, 32, 0.98), rgba(5, 11, 18, 0.94))"
    boxShadow: "0 1px 0 rgba(88, 152, 200, 0.28), 0 0 36px rgba(101, 200, 255, 0.08)"
  sidebar:
    background: "linear-gradient(180deg, rgba(2, 4, 8, 0.98), rgba(9, 16, 32, 0.92))"
    boxShadow: "1px 0 0 rgba(88, 152, 200, 0.24), 12px 0 44px rgba(0, 0, 0, 0.38)"
  tab:
    clipPath: "polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%)"
  backdrop: {}
  badge: {}
  progress:
    background: "rgba(14, 31, 53, 0.88)"
  footer:
    background: "rgba(2, 4, 8, 0.96)"
    boxShadow: "0 -1px 0 rgba(88, 152, 200, 0.22)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Cinematic dashboard atmosphere: blue + amber bloom fields ─────────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 62% 36%, rgba(101, 200, 255, 0.14), transparent 34%),
      radial-gradient(circle at 70% 58%, rgba(242, 122, 0, 0.13), transparent 30%),
      linear-gradient(135deg, #020408 0%, #050B12 44%, #091020 100%);
  }

  /* ── Fine screen grain + faint scanline, kept readable ─────────────────── */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2; /* below modals/overlays */
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(101, 200, 255, 0.012) 4px,
        rgba(101, 200, 255, 0.012) 5px
      ),
      radial-gradient(rgba(255, 255, 255, 0.10) 1px, transparent 1px);
    background-size: auto, 3px 3px;
    opacity: 0.36;
    mix-blend-mode: screen;
  }

  /* ── Nav active item: cyan rail with amber data pulse undertone ────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 2px solid #65C8FF;
    padding-left: calc(0.75rem - 2px);
    background: linear-gradient(90deg, rgba(101, 200, 255, 0.12), rgba(255, 145, 0, 0.035));
    box-shadow: inset 8px 0 24px rgba(101, 200, 255, 0.08);
  }

  /* ── Chart bars/areas: measured steel-blue with cinematic glow ─────────── */
  .recharts-bar-rectangle path,
  [class*="bar-"] rect {
    fill: #5898C8 !important;
    filter: drop-shadow(0 0 10px rgba(101, 200, 255, 0.28));
    opacity: 0.92;
  }

  .recharts-line path,
  [class*="sparkline"] path,
  [class*="trend"] path {
    stroke: #65C8FF !important;
    filter: drop-shadow(0 0 8px rgba(101, 200, 255, 0.38));
  }

  /* ── Warm data/alert hooks: orange stays rare and meaningful ───────────── */
  .warning,
  [data-variant="warning"],
  [role="alert"][data-severity="warning"] {
    color: #FFB326 !important;
    border-color: rgba(255, 145, 0, 0.42) !important;
    box-shadow: 0 0 20px rgba(242, 122, 0, 0.18);
  }

  /* ── Table / list row hover and selected states ─────────────────────────── */
  tr:hover td,
  [role="row"]:hover {
    background: rgba(88, 152, 200, 0.07);
  }
  tr[aria-selected="true"] td,
  [role="row"][aria-selected="true"] {
    background: rgba(101, 200, 255, 0.08);
    box-shadow: inset 3px 0 0 #65C8FF;
  }

  /* ── Table cost / positive values: cool mint, not decorative green ─────── */
  td[data-col="cost"],
  .cost-value {
    color: #7DFFDA !important;
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI values: icy, sharp, premium terminal feel ─────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"] {
    color: #F3F8FF !important;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px rgba(168, 216, 248, 0.34);
  }

  /* ── Card headings: blue-gray labels that recede behind the numbers ────── */
  .card-title,
  [class*="CardTitle"] {
    color: #B9D4F2;
    letter-spacing: 0.01em;
    font-size: 0.875rem;
    font-weight: 600;
  }

  /* ── Focus rings: accessible cyan, with tiny bloom ─────────────────────── */
  *:focus-visible {
    outline: 1.5px solid #65C8FF;
    outline-offset: 2px;
    box-shadow: 0 0 0 1px rgba(101, 200, 255, 0.32), 0 0 24px rgba(45, 143, 232, 0.28);
  }

  /* ── Selection highlight ───────────────────────────────────────────────── */
  ::selection {
    background: rgba(101, 200, 255, 0.28);
    color: #F3F8FF;
  }

  /* ── Scrollbar: thin steel-blue ────────────────────────────────────────── */
  ::-webkit-scrollbar {
    width: 4px;
    height: 4px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(88, 152, 200, 0.52);
    border-radius: 2px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(101, 200, 255, 0.74);
  }

  /* ── Loading / skeleton states ────────────────────────────────────────── */
  [data-skeleton="true"],
  .skeleton,
  [class*="skeleton"] {
    background: #091020;
    background-image: linear-gradient(90deg, #091020 0%, rgba(101, 200, 255, 0.14) 50%, #091020 100%);
    background-size: 200% 100%;
  }

  /* ── Disabled states ────────────────────────────────────────────────────── */
  [disabled],
  [aria-disabled="true"],
  .disabled {
    color: #4E6A86 !important;
    opacity: 0.52;
    pointer-events: none;
  }

  /* ── Live/status badge: amber pulse only for real-time emphasis ────────── */
  .live-badge,
  [data-variant="live"],
  [class*="pulsing"] {
    background: #FF9100 !important;
    color: #020408 !important;
    box-shadow: 0 0 10px rgba(255, 145, 0, 0.55), 0 0 34px rgba(242, 122, 0, 0.24);
  }

  /* ── Badge variants: semantic glow only ─────────────────────────────────── */
  [data-variant="default"],
  [data-variant="secondary"] {
    box-shadow: none;
    border-color: rgba(88, 152, 200, 0.44);
  }
