name: helios
label: Helios
description: "Deep navy command center – amber-gold accent, high contrast, colorblind-safe"

# ─── Palette ──────────────────────────────────────────────────────────────────
# All text/bg pairs verified WCAG AA (4.5:1) or AAA (7:1).
# Accent strategy: amber (primary) + blue (secondary) — safe for all colorblind types.
# No red/green semantic pairing anywhere in this theme.
palette:
  background:
    hex: "#0A0A14"    # Pillow-measured dominant; not pure black (halation risk for elders)
    alpha: 1.0
  midground: "#F5F0E8"  # Warm cream — ~18:1 on bg, reduces eye strain vs pure white
  foreground:
    hex: "#F5A623"    # Amber accent glow layer
    alpha: 0.08
  warmGlow: "rgba(245, 166, 35, 0.14)"   # Amber warmth — cohesive with accent
  noiseOpacity: 0.25   # Minimal grain — elders prefer clean surfaces

# ─── Typography ───────────────────────────────────────────────────────────────
# Inter: large x-height, open counters — best legibility at small sizes (Gemini rec)
# letterSpacing: positive — opens type for aging eyes (Gemini: +0.02em)
typography:
  fontSans: '"Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.02em"   # Positive — opens up type, elder-friendly (Gemini rec)

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.5rem"
  density: comfortable   # NOT compact — elders need generous tap targets and breathing room

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
# Contrast ratios vs card bg (#141E28):
#   #F5A623 amber:    ~9.8:1  ✓ AAA
#   #4A9EFF blue:     ~7.2:1  ✓ AAA
#   #F5F0E8 cream:    ~14.8:1 ✓ AAA
#   #C8BFB0 sec text: ~7.6:1  ✓ AAA
#   #8FA4B8 muted:    ~4.6:1  ✓ AA  (min allowed)
#   #FF6B35 destr:    ~6.1:1  ✓ AA+ (orange-red, distinct from blue without hue reliance)
#   #00B4D8 success:  ~6.8:1  ✓ AA+ (blue-teal — NOT green, colorblind safe)
colorOverrides:
  primary: "#F5A623"              # Amber — primary CTA, active states
  primaryForeground: "#0A0A14"
  accent: "#4A9EFF"               # Electric blue — secondary, links, highlights
  accentForeground: "#0A0A14"
  ring: "#F5A623"                 # Amber focus ring — thick 2px in customCSS
  success: "#00B4D8"              # Blue-teal — NOT green (colorblind safe)
  successForeground: "#0A0A14"
  warning: "#F5A623"              # Amber — same as primary; unambiguous
  warningForeground: "#0A0A14"
  destructive: "#FF6B35"          # Orange-red — NOT pure red; distinct from blue
  destructiveForeground: "#F5F0E8"
  border: "rgba(245, 166, 35, 0.30)"   # High-contrast amber border — visible at a glance
  input: "rgba(20, 30, 40, 0.95)"
  muted: "rgba(10, 10, 20, 0.90)"
  mutedForeground: "#8FA4B8"      # 4.6:1 on card bg — passes AA
  card: "#141E28"                 # Pillow-measured navy panel
  cardForeground: "#F5F0E8"       # Warm cream — 14.8:1 ✓ AAA
  secondary: "#1E2832"            # Pillow-measured raised surface
  secondaryForeground: "#C8BFB0"  # Warm mid-gray — 7.6:1 ✓ AAA
  popover: "#141E28"
  popoverForeground: "#F5F0E8"


# ─── Assets ───────────────────────────────────────────────────────────────────
# Custom background image: layered liquid splashes (lime, dark, electric blue)
assets:
  bg: "/ds-assets/010bg.png"
# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, #1E2832 0%, #141E28 100%)"
    boxShadow: "inset 0 0 0 1px rgba(245, 166, 35, 0.20), 0 2px 16px rgba(0, 0, 0, 0.40)"
  header:
    background: "#0A0A14"
    boxShadow: "0 1px 0 rgba(245, 166, 35, 0.25)"
  sidebar:
    background: "linear-gradient(180deg, #141E28 0%, #0A0A14 100%)"
    boxShadow: "1px 0 0 rgba(245, 166, 35, 0.18), 8px 0 32px rgba(0, 0, 0, 0.50)"
  tab: {}
  backdrop: {}
  badge: {}
  progress:
    background: "#141E28"
  footer:
    background: "#0A0A14"
    boxShadow: "0 -1px 0 rgba(245, 166, 35, 0.18)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Warm depth atmosphere — amber-tinged navy, gentle vignette ─────────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 80% 10%, rgba(245, 166, 35, 0.07), transparent 40%),
      radial-gradient(circle at 20% 85%, rgba(74, 158, 255, 0.05), transparent 35%),
      radial-gradient(circle at 50% 60%, transparent 50%, #0A0A14 115%),
      #0A0A14;
  }

  /* ── Nav active item: amber left rail ────────────────────────────────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 3px solid #F5A623;   /* Thicker — more visible for elders */
    padding-left: calc(0.75rem - 3px);
    background: rgba(245, 166, 35, 0.08);
  }

  /* ── Chart bars: amber primary series with blue secondary glow ───────────── */
  .recharts-wrapper .recharts-bar-rectangle path,
  .recharts-wrapper [class*="bar-"]:not([class*="progress"]) rect {
    fill: #F5A623;
    filter: drop-shadow(0 0 6px rgba(245, 166, 35, 0.40));
  }

  .recharts-wrapper .recharts-line path,
  [class*="sparkline"] path,
  [class*="trend"] path {
    stroke: #4A9EFF;
    stroke-width: 2.5px;   /* Thicker lines — elder-friendly */
    filter: drop-shadow(0 0 6px rgba(74, 158, 255, 0.38));
  }

  /* ── Table / list row hover and selection ────────────────────────────────── */
  tr:hover td,
  [role="row"]:hover {
    background: rgba(245, 166, 35, 0.06) !important;
  }
  tr[aria-selected="true"] td,
  [role="row"][aria-selected="true"] {
    background: rgba(245, 166, 35, 0.12) !important;
    box-shadow: inset 3px 0 0 #F5A623;
  }

  /* ── Tabular numerics for KPIs, tables, cost ─────────────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  td,
  .cost-value {
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI values: cream + amber glow — high contrast, warm, readable ─────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  .cost-value {
    color: #F5F0E8 !important;
    font-weight: 600;          /* Heavier weight — elder readability */
    letter-spacing: 0.01em;
    text-shadow: 0 0 14px rgba(245, 166, 35, 0.22);
  }

  /* ── Card titles: warm mid-tone, comfortable contrast ───────────────────── */
  .card-title,
  [class*="CardTitle"] {
    color: #C8BFB0;
    font-size: 0.9375rem;      /* 15px — at baseSize floor, not below */
    font-weight: 600;
    letter-spacing: 0.02em;   /* Positive — open, elder-friendly */
  }

  /* ── Focus rings: thick 2px amber — WCAG 2.4.11 (AAA) compliant ─────────── */
  *:focus-visible {
    outline: 2px solid #F5A623;   /* 2px — elder-friendly thick ring */
    outline-offset: 3px;
    box-shadow: 0 0 0 2px rgba(245, 166, 35, 0.25), 0 0 16px rgba(245, 166, 35, 0.18);
  }

  /* ── Selection highlight ─────────────────────────────────────────────────── */
  ::selection {
    background: rgba(245, 166, 35, 0.28);
    color: #F5F0E8;
  }

  /* ── Scrollbar: thick 6px — elder-friendly grab target ──────────────────── */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(20, 30, 40, 0.60);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(245, 166, 35, 0.50);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(245, 166, 35, 0.80);
  }

  /* ── Loading / skeleton states ───────────────────────────────────────────── */
  [data-skeleton="true"],
  .skeleton,
  [class*="skeleton"] {
    background: #141E28;
    background-image: linear-gradient(90deg, #141E28 0%, rgba(245, 166, 35, 0.10) 50%, #141E28 100%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 2s infinite linear;
  }
  @keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Disabled states: clearly dimmed, not just color-shifted ────────────── */
  [disabled],
  [aria-disabled="true"],
  .disabled {
    color: #3A4A5A !important;
    opacity: 0.55;
    pointer-events: none;
  }

  /* ── Live badge: amber pulse — high contrast, shape+color dual cue ───────── */
  [data-variant="live"] {
    background: #F5A623 !important;
    color: #0A0A14 !important;
    font-weight: 700 !important;
    box-shadow: 0 0 12px rgba(245, 166, 35, 0.60);
    animation: live-pulse 2s infinite;
  }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 rgba(245, 166, 35, 0.50); }
    70% { box-shadow: 0 0 0 10px rgba(245, 166, 35, 0); }
    100% { box-shadow: 0 0 0 0 rgba(245, 166, 35, 0); }
  }

  /* ── Progress bars: amber fill — consistent with primary accent ──────────── */
  [role="progressbar"] [class*="indicator"] {
    background: #F5A623 !important;
    box-shadow: 0 0 8px rgba(245, 166, 35, 0.45);
  }

  /* ── Success states: blue-teal (colorblind safe, not green) ─────────────── */
  [data-variant="success"],
  .text-success,
  [class*="success"] {
    color: #00B4D8 !important;
  }

  /* ── Destructive states: orange-red (not pure red, distinct from blue) ───── */
  [data-variant="destructive"],
  .text-destructive,
  [class*="destructive"]:not([class*="Foreground"]):not([class*="background"]) {
    color: #FF6B35 !important;
  }

  /* ── Cron tab: Badge color overrides ─────────────────────────────────────── */
  /* Success badge: override hardcoded emerald → blue-teal (colorblind safe) */
  .inline-flex.items-center.border.text-emerald-400 {
    color: #00B4D8 !important;
  }
  .inline-flex.items-center.border[class*="bg-emerald"] {
    background: rgba(0, 180, 216, 0.15) !important;
  }
  .inline-flex.items-center.border[class*="border-emerald"] {
    border-color: rgba(0, 180, 216, 0.30) !important;
  }
  /* Warning badge: ensure amber override takes priority */
  .inline-flex.items-center.border.text-warning {
    color: #F5A623 !important;
    background: rgba(245, 166, 35, 0.15) !important;
    border-color: rgba(245, 166, 35, 0.30) !important;
  }
  /* Destructive badge: ensure orange-red override */
  .inline-flex.items-center.border.text-destructive {
    color: #FF6B35 !important;
    background: rgba(255, 107, 53, 0.15) !important;
    border-color: rgba(255, 107, 53, 0.30) !important;
  }

  /* ── Cron tab: Job card state rails + hover ──────────────────────────────── */
  /* Active job (has resume/play icon → currently paused) → amber left rail */
  .flex.flex-col.gap-3 > .border:has(.text-success) {
    border-left: 3px solid #00B4D8;
    background: rgba(0, 180, 216, 0.04);
  }
  /* Paused job (has pause icon → currently running) → amber left rail */
  .flex.flex-col.gap-3 > .border:has(.text-warning) {
    border-left: 3px solid #F5A623;
    background: rgba(245, 166, 35, 0.04);
  }
  /* Job card hover glow */
  .flex.flex-col.gap-3 > .border:hover {
    background: rgba(245, 166, 35, 0.06) !important;
    box-shadow: inset 0 0 0 1px rgba(245, 166, 35, 0.15), 0 2px 12px rgba(0, 0, 0, 0.30);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  /* ── Cron tab: Schedule display — amber mono, visually distinct ──────────── */
  .flex.items-center.gap-4.text-xs.text-muted-foreground .font-mono {
    color: #F5A623 !important;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  /* ── Cron tab: Job name — cream, bold, scannable ─────────────────────────── */
  .flex.items-center.gap-2.mb-1 > .font-medium {
    color: #F5F0E8;
    font-weight: 600;
  }

  /* ── Cron tab: Section header — amber Clock icon ─────────────────────────── */
  .flex.items-center.gap-2.text-muted-foreground > .h-4.w-4 {
    color: #F5A623;
  }

  /* ═══════════════════════════════════════════════════════════════════════
     HELIOS — Cross-Tab Readability Enhancements
     Target: 50-year-old daily user, 2-4 hours/day
     Codex GPT-5.5 review 2026-04-26
     ═══════════════════════════════════════════════════════════════════════ */

  /* ── SHARED: Search inputs across Sessions, Skills, Config ──────────────── */
  .relative.w-full.min-w-0 input.h-8.pl-8.pr-7.text-xs,
  .relative.w-full.min-w-0.sm\:max-w-xs input.h-8.pl-8.pr-7.text-xs {
    min-height: 44px !important;
    height: 44px !important;
    font-size: 16px !important;
    line-height: 1.6 !important;
    padding-left: 2.75rem !important;
    padding-right: 2.5rem !important;
    color: #F5F0E8 !important;
    background: #141E28 !important;
    border-color: rgba(245, 166, 35, 0.40) !important;
  }
  .relative.w-full.min-w-0 input.h-8.pl-8.pr-7.text-xs::placeholder,
  .relative.w-full.min-w-0.sm\:max-w-xs input.h-8.pl-8.pr-7.text-xs::placeholder {
    color: #8FA4B8 !important;
    opacity: 1 !important;
  }
  .relative.w-full.min-w-0 input.h-8.pl-8.pr-7.text-xs:focus-visible,
  .relative.w-full.min-w-0.sm\:max-w-xs input.h-8.pl-8.pr-7.text-xs:focus-visible {
    border-color: #F5A623 !important;
    box-shadow: 0 0 0 2px rgba(245, 166, 35, 0.28) !important;
  }
  .relative.w-full.min-w-0 svg.text-muted-foreground,
  .relative.w-full.min-w-0.sm\:max-w-xs svg.text-muted-foreground {
    color: #F5A623 !important;
    width: 18px !important;
    height: 18px !important;
  }
  .relative.w-full.min-w-0 button.absolute,
  .relative.w-full.min-w-0.sm\:max-w-xs button.absolute {
    min-width: 36px !important;
    min-height: 36px !important;
    display: grid !important;
    place-items: center !important;
    color: #8FA4B8 !important;
  }
  .relative.w-full.min-w-0 button.absolute:hover,
  .relative.w-full.min-w-0.sm\:max-w-xs button.absolute:hover {
    color: #F5F0E8 !important;
    background: rgba(0, 180, 216, 0.12) !important;
  }

  /* ── SHARED: Tables across Analytics, Skills, Logs ──────────────────────── */
  table.w-full.text-sm {
    font-size: 0.9375rem !important;
    line-height: 1.6 !important;
  }
  table.w-full.text-sm thead tr {
    border-bottom-color: rgba(245, 166, 35, 0.35) !important;
  }
  table.w-full.text-sm thead tr th,
  table.w-full.text-sm thead tr.text-xs th {
    color: #F5F0E8 !important;
    font-size: 0.875rem !important;
    font-weight: 700 !important;
    padding-top: 0.75rem !important;
    padding-bottom: 0.75rem !important;
    line-height: 1.6 !important;
  }
  table.w-full.text-sm td {
    padding-top: 0.625rem !important;
    padding-bottom: 0.625rem !important;
  }
  table.w-full.text-sm tbody tr {
    border-bottom-color: rgba(143, 164, 184, 0.18) !important;
  }
  table.w-full.text-sm tbody tr:hover {
    background: rgba(245, 166, 35, 0.06) !important;
  }
  table.w-full.text-sm .text-muted-foreground {
    color: #8FA4B8 !important;
  }
  table.w-full.text-sm .text-emerald-400 {
    color: #00B4D8 !important;
    font-weight: 600 !important;
  }
  table.w-full.text-sm .text-\[#ffe6cb\] {
    color: #F5A623 !important;
    font-weight: 600 !important;
  }

  /* ── SHARED: Buttons — minimum comfortable click targets ────────────────── */
  button.h-7.text-xs {
    min-height: 36px !important;
    font-size: 0.875rem !important;
    line-height: 1.4 !important;
  }

  /* ── SHARED: Badge sizing floor ─────────────────────────────────────────── */
  .inline-flex.items-center.border.px-2.py-0\.5.text-\[0\.65rem\] {
    font-size: 0.8125rem !important;
    padding: 0.25rem 0.625rem !important;
    letter-spacing: 0.08em !important;
  }

  /* ── SHARED: Tooltip readability ────────────────────────────────────────── */
  .absolute.bottom-full .bg-card.border.border-border.px-2\.5.py-1\.5.text-\[10px\] {
    background: #141E28 !important;
    border-color: #F5A623 !important;
    color: #F5F0E8 !important;
    font-size: 0.875rem !important;
    line-height: 1.6 !important;
    padding: 0.5rem 0.75rem !important;
  }

  /* ── ANALYTICS: KPI cards ───────────────────────────────────────────────── */
  .grid.gap-4.sm\:grid-cols-2.lg\:grid-cols-3 .text-sm.font-medium {
    color: #F5F0E8 !important;
    font-size: 1rem !important;
    line-height: 1.6 !important;
  }
  .grid.gap-4.sm\:grid-cols-2.lg\:grid-cols-3 .text-2xl.font-bold {
    font-family: var(--theme-font-sans) !important;
    color: #F5A623 !important;
    font-size: 2rem !important;
    font-weight: 600 !important;
    line-height: 1.2 !important;
    -webkit-font-smoothing: antialiased !important;
    -moz-osx-font-smoothing: grayscale !important;
    text-rendering: optimizeLegibility !important;
    font-variant-numeric: tabular-nums !important;
  }
  .grid.gap-4.sm\:grid-cols-2.lg\:grid-cols-3 p.text-xs.text-muted-foreground {
    color: #8FA4B8 !important;
    font-size: 0.9375rem !important;
  }
  .grid.gap-4.sm\:grid-cols-2.lg\:grid-cols-3 svg.text-muted-foreground {
    color: #00B4D8 !important;
  }

  /* ── ANALYTICS: Period selector buttons ─────────────────────────────────── */
  .flex.w-full.min-w-0.flex-wrap.items-center.justify-end.gap-2 button.h-7 {
    min-height: 2.5rem !important;
    padding: 0 0.875rem !important;
    font-size: 0.9375rem !important;
  }

  /* ── ANALYTICS: Chart legend and axis labels ────────────────────────────── */
  .flex.items-center.gap-4.text-xs.text-muted-foreground {
    color: #F5F0E8 !important;
    font-size: 0.9375rem !important;
  }
  .flex.justify-between.mt-2.text-\[10px\].text-muted-foreground {
    color: #8FA4B8 !important;
    font-size: 0.875rem !important;
  }

  /* ── ANALYTICS: Chart color overrides (emerald → blue-teal, cream → amber) */
  .h-2\.5.w-2\.5.bg-emerald-500,
  .w-full.bg-emerald-500\/70 {
    background: #00B4D8 !important;
  }
  .h-2\.5.w-2\.5.bg-\[\#ffe6cb\],
  .w-full.bg-\[\#ffe6cb\]\/70 {
    background: #F5A623 !important;
  }

  /* ══ DAILY TOKEN CHART — Full enhancement (Codex GPT-5.5 review) ═══════ */

  /* Chart card: stronger border, amber icon, readable title */
  .border.border-border.bg-card\/80.text-card-foreground.w-full:has(.flex.items-end.gap-\[2px\]) {
    border-color: rgba(143, 164, 184, 0.45) !important;
  }
  .border.border-border.bg-card\/80.text-card-foreground.w-full:has(.flex.items-end.gap-\[2px\]) .h-5.w-5.text-muted-foreground {
    color: #F5A623 !important;
  }
  .border.border-border.bg-card\/80.text-card-foreground.w-full:has(.flex.items-end.gap-\[2px\]) h3.text-base {
    color: #F5F0E8 !important;
    font-size: 1rem !important;
  }

  /* Legend: larger swatches, amber + blue-teal, readable text */
  .border.border-border.bg-card\/80.text-card-foreground.w-full:has(.flex.items-end.gap-\[2px\]) .flex.items-center.gap-4.text-xs.text-muted-foreground {
    color: #F5F0E8 !important;
    font-size: 0.9375rem !important;
    gap: 1.25rem !important;
  }
  .border.border-border.bg-card\/80.text-card-foreground.w-full:has(.flex.items-end.gap-\[2px\]) .h-2\.5.w-2\.5.bg-\[\#ffe6cb\] {
    width: 0.875rem !important;
    height: 0.875rem !important;
    background: #F5A623 !important;
    border-radius: 0.125rem !important;
    box-shadow: 0 0 0 1px #141E28, 0 0 0 2px #F5A623 !important;
  }
  .border.border-border.bg-card\/80.text-card-foreground.w-full:has(.flex.items-end.gap-\[2px\]) .h-2\.5.w-2\.5.bg-emerald-500 {
    width: 0.875rem !important;
    height: 0.875rem !important;
    background: #00B4D8 !important;
    border-radius: 0.125rem !important;
    box-shadow: 0 0 0 1px #141E28, 0 0 0 2px #00B4D8 !important;
  }

  /* Chart field: horizontal grid lines + wider bar gap + scrollable for 90d */
  .border.border-border.bg-card\/80.text-card-foreground.w-full:has(.flex.items-end.gap-\[2px\]) > div > .flex.items-end.gap-\[2px\] {
    gap: 3px !important;
    position: relative !important;
    background-image: repeating-linear-gradient(
      to top,
      rgba(143, 164, 184, 0.20) 0,
      rgba(143, 164, 184, 0.20) 1px,
      transparent 1px,
      transparent 40px
    ) !important;
    background-position: left bottom !important;
  }

  /* Scrollable container for dense 30d/90d charts */
  .border.border-border.bg-card\/80.text-card-foreground.w-full:has(.flex.items-end.gap-\[2px\]) > .p-4 {
    overflow-x: auto !important;
    overflow-y: visible !important;
  }

  /* Bar hover: amber rail on hovered day */
