name: helios
label: Helios
description: "Deep navy command center – amber-gold accent, high contrast, colorblind-safe"

# ─── Palette ──────────────────────────────────────────────────────────────────
# All text/bg pairs verified WCAG AA (4.5:1) or AAA (7:1).
# Accent strategy: amber (primary) + blue (secondary) — safe for all colorblind types.
# No red/green semantic pairing anywhere in this theme.
palette:
  background:
    hex: "#0A0A14"    # Pillow-measured dominant; not pure black (halation risk for elders)
    alpha: 1.0
  midground: "#F5F0E8"  # Warm cream — ~18:1 on bg, reduces eye strain vs pure white
  foreground:
    hex: "#F5A623"    # Amber accent glow layer
    alpha: 0.08
  warmGlow: "rgba(245, 166, 35, 0.14)"   # Amber warmth — cohesive with accent
  noiseOpacity: 0.25   # Minimal grain — elders prefer clean surfaces

# ─── Typography ───────────────────────────────────────────────────────────────
# Inter: large x-height, open counters — best legibility at small sizes (Gemini rec)
# letterSpacing: positive — opens type for aging eyes (Gemini: +0.02em)
typography:
  fontSans: '"Inter", "SF Pro Display", "IBM Plex Sans", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.02em"   # Positive — opens up type, elder-friendly (Gemini rec)

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.5rem"
  density: comfortable   # NOT compact — elders need generous tap targets and breathing room

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
# Contrast ratios vs card bg (#141E28):
#   #F5A623 amber:    ~9.8:1  ✓ AAA
#   #4A9EFF blue:     ~7.2:1  ✓ AAA
#   #F5F0E8 cream:    ~14.8:1 ✓ AAA
#   #C8BFB0 sec text: ~7.6:1  ✓ AAA
#   #8FA4B8 muted:    ~4.6:1  ✓ AA  (min allowed)
#   #FF6B35 destr:    ~6.1:1  ✓ AA+ (orange-red, distinct from blue without hue reliance)
#   #00B4D8 success:  ~6.8:1  ✓ AA+ (blue-teal — NOT green, colorblind safe)
colorOverrides:
  primary: "#F5A623"              # Amber — primary CTA, active states
  primaryForeground: "#0A0A14"
  accent: "#4A9EFF"               # Electric blue — secondary, links, highlights
  accentForeground: "#0A0A14"
  ring: "#F5A623"                 # Amber focus ring — thick 2px in customCSS
  success: "#00B4D8"              # Blue-teal — NOT green (colorblind safe)
  successForeground: "#0A0A14"
  warning: "#F5A623"              # Amber — same as primary; unambiguous
  warningForeground: "#0A0A14"
  destructive: "#FF6B35"          # Orange-red — NOT pure red; distinct from blue
  destructiveForeground: "#F5F0E8"
  border: "rgba(245, 166, 35, 0.30)"   # High-contrast amber border — visible at a glance
  input: "rgba(20, 30, 40, 0.95)"
  muted: "rgba(10, 10, 20, 0.90)"
  mutedForeground: "#8FA4B8"      # 4.6:1 on card bg — passes AA
  card: "#141E28"                 # Pillow-measured navy panel
  cardForeground: "#F5F0E8"       # Warm cream — 14.8:1 ✓ AAA
  secondary: "#1E2832"            # Pillow-measured raised surface
  secondaryForeground: "#C8BFB0"  # Warm mid-gray — 7.6:1 ✓ AAA
  popover: "#141E28"
  popoverForeground: "#F5F0E8"

# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, #1E2832 0%, #141E28 100%)"
    boxShadow: "inset 0 0 0 1px rgba(245, 166, 35, 0.20), 0 2px 16px rgba(0, 0, 0, 0.40)"
  header:
    background: "#0A0A14"
    boxShadow: "0 1px 0 rgba(245, 166, 35, 0.25)"
  sidebar:
    background: "linear-gradient(180deg, #141E28 0%, #0A0A14 100%)"
    boxShadow: "1px 0 0 rgba(245, 166, 35, 0.18), 8px 0 32px rgba(0, 0, 0, 0.50)"
  tab: {}
  backdrop: {}
  badge: {}
  progress:
    background: "#141E28"
  footer:
    background: "#0A0A14"
    boxShadow: "0 -1px 0 rgba(245, 166, 35, 0.18)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Warm depth atmosphere — amber-tinged navy, gentle vignette ─────────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 80% 10%, rgba(245, 166, 35, 0.07), transparent 40%),
      radial-gradient(circle at 20% 85%, rgba(74, 158, 255, 0.05), transparent 35%),
      radial-gradient(circle at 50% 60%, transparent 50%, #0A0A14 115%),
      #0A0A14;
  }

  /* ── Nav active item: amber left rail ────────────────────────────────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 3px solid #F5A623;   /* Thicker — more visible for elders */
    padding-left: calc(0.75rem - 3px);
    background: rgba(245, 166, 35, 0.08);
  }

  /* ── Chart bars: amber primary series with blue secondary glow ───────────── */
  .recharts-wrapper .recharts-bar-rectangle path,
  .recharts-wrapper [class*="bar-"]:not([class*="progress"]) rect {
    fill: #F5A623;
    filter: drop-shadow(0 0 6px rgba(245, 166, 35, 0.40));
  }

  .recharts-wrapper .recharts-line path,
  [class*="sparkline"] path,
  [class*="trend"] path {
    stroke: #4A9EFF;
    stroke-width: 2.5px;   /* Thicker lines — elder-friendly */
    filter: drop-shadow(0 0 6px rgba(74, 158, 255, 0.38));
  }

  /* ── Table / list row hover and selection ────────────────────────────────── */
  tr:hover td,
  [role="row"]:hover {
    background: rgba(245, 166, 35, 0.06) !important;
  }
  tr[aria-selected="true"] td,
  [role="row"][aria-selected="true"] {
    background: rgba(245, 166, 35, 0.12) !important;
    box-shadow: inset 3px 0 0 #F5A623;
  }

  /* ── Tabular numerics for KPIs, tables, cost ─────────────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  td,
  .cost-value {
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI values: cream + amber glow — high contrast, warm, readable ─────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"],
  .cost-value {
    color: #F5F0E8 !important;
    font-weight: 600;          /* Heavier weight — elder readability */
    letter-spacing: 0.01em;
    text-shadow: 0 0 14px rgba(245, 166, 35, 0.22);
  }

  /* ── Card titles: warm mid-tone, comfortable contrast ───────────────────── */
  .card-title,
  [class*="CardTitle"] {
    color: #C8BFB0;
    font-size: 0.9375rem;      /* 15px — at baseSize floor, not below */
    font-weight: 600;
    letter-spacing: 0.02em;   /* Positive — open, elder-friendly */
  }

  /* ── Focus rings: thick 2px amber — WCAG 2.4.11 (AAA) compliant ─────────── */
  *:focus-visible {
    outline: 2px solid #F5A623;   /* 2px — elder-friendly thick ring */
    outline-offset: 3px;
    box-shadow: 0 0 0 2px rgba(245, 166, 35, 0.25), 0 0 16px rgba(245, 166, 35, 0.18);
  }

  /* ── Selection highlight ─────────────────────────────────────────────────── */
  ::selection {
    background: rgba(245, 166, 35, 0.28);
    color: #F5F0E8;
  }

  /* ── Scrollbar: thick 6px — elder-friendly grab target ──────────────────── */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(20, 30, 40, 0.60);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(245, 166, 35, 0.50);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(245, 166, 35, 0.80);
  }

  /* ── Loading / skeleton states ───────────────────────────────────────────── */
  [data-skeleton="true"],
  .skeleton,
  [class*="skeleton"] {
    background: #141E28;
    background-image: linear-gradient(90deg, #141E28 0%, rgba(245, 166, 35, 0.10) 50%, #141E28 100%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 2s infinite linear;
  }
  @keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Disabled states: clearly dimmed, not just color-shifted ────────────── */
  [disabled],
  [aria-disabled="true"],
  .disabled {
    color: #3A4A5A !important;
    opacity: 0.55;
    pointer-events: none;
  }

  /* ── Live badge: amber pulse — high contrast, shape+color dual cue ───────── */
  [data-variant="live"] {
    background: #F5A623 !important;
    color: #0A0A14 !important;
    font-weight: 700 !important;
    box-shadow: 0 0 12px rgba(245, 166, 35, 0.60);
    animation: live-pulse 2s infinite;
  }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 rgba(245, 166, 35, 0.50); }
    70% { box-shadow: 0 0 0 10px rgba(245, 166, 35, 0); }
    100% { box-shadow: 0 0 0 0 rgba(245, 166, 35, 0); }
  }

  /* ── Progress bars: amber fill — consistent with primary accent ──────────── */
  [role="progressbar"] [class*="indicator"] {
    background: #F5A623 !important;
    box-shadow: 0 0 8px rgba(245, 166, 35, 0.45);
  }

  /* ── Success states: blue-teal (colorblind safe, not green) ─────────────── */
  [data-variant="success"],
  .text-success,
  [class*="success"] {
    color: #00B4D8 !important;
  }

  /* ── Destructive states: orange-red (not pure red, distinct from blue) ───── */
  [data-variant="destructive"],
  .text-destructive,
  [class*="destructive"]:not([class*="Foreground"]):not([class*="background"]) {
    color: #FF6B35 !important;
  }
