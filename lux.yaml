name: lux
label: Lux
description: >
  Deep indigo command center. Electric cyan accent, sharp geometry,
  JetBrains Mono data readouts. Built for extended sessions.

# ─── Palette ──────────────────────────────────────────────────────────────────
palette:
  background:
    hex: "#080b18"    # near-void indigo-black
    alpha: 1.0
  midground: "#a8c8ff"  # cool periwinkle — primary text + chrome
  foreground:
    hex: "#00e5ff"    # electric cyan — top-layer highlight
    alpha: 0.08       # subtle, rises through colorOverrides where needed
  warmGlow: "rgba(0, 229, 255, 0.12)"   # cyan ambient vignette
  noiseOpacity: 0.45   # light grain — polished not gritty

# ─── Typography ───────────────────────────────────────────────────────────────
typography:
  fontSans: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", "Fira Code", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  baseSize: "14px"
  lineHeight: "1.55"
  letterSpacing: "-0.01em"

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  radius: "0.25rem"    # sharp but not zero — cards have a micro bevel
  density: compact

layoutVariant: standard

# ─── Color overrides ──────────────────────────────────────────────────────────
# The 3-layer palette gives us a solid base; pin the key accents explicitly.
colorOverrides:
  primary: "#00e5ff"          # electric cyan CTA buttons
  primaryForeground: "#080b18"
  accent: "#00e5ff"
  accentForeground: "#080b18"
  ring: "#00e5ff"
  success: "#00ffa3"          # bright mint for cost/positive values
  destructive: "#ff3d6b"      # vivid pink-red
  border: "rgba(0, 229, 255, 0.15)"
  input: "rgba(0, 229, 255, 0.08)"
  muted: "rgba(168, 200, 255, 0.08)"
  mutedForeground: "rgba(168, 200, 255, 0.55)"

# ─── Component chrome ─────────────────────────────────────────────────────────
componentStyles:
  card:
    background: "linear-gradient(160deg, rgba(14, 20, 48, 0.92), rgba(8, 11, 24, 0.96))"
    boxShadow: "inset 0 0 0 1px rgba(0, 229, 255, 0.12), 0 4px 24px rgba(0, 0, 0, 0.5)"
  header:
    background: "linear-gradient(180deg, rgba(10, 14, 35, 0.98), rgba(8, 11, 24, 0.95))"
    boxShadow: "0 1px 0 rgba(0, 229, 255, 0.12)"
  tab:
    clipPath: "polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%)"
  sidebar:
    background: "linear-gradient(180deg, rgba(10, 14, 35, 0.98), rgba(8, 11, 24, 0.97))"
    boxShadow: "1px 0 0 rgba(0, 229, 255, 0.10)"
  backdrop: {}
  badge:
    boxShadow: "0 0 6px rgba(0, 229, 255, 0.4)"

# ─── Custom CSS ───────────────────────────────────────────────────────────────
customCSS: |
  /* ── Subtle scanline texture across the full viewport ─────────────────── */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0, 229, 255, 0.018) 4px,
      rgba(0, 229, 255, 0.018) 5px
    );
    mix-blend-mode: screen;
  }

  /* ── Nav item active state: cyan left bar ─────────────────────────────── */
  [data-active="true"],
  .nav-item[aria-current="page"] {
    border-left: 2px solid #00e5ff;
    padding-left: calc(0.75rem - 2px);
  }

  /* ── Chart bars: replace muted beige with cyan gradient ──────────────── */
  .recharts-bar-rectangle path,
  [class*="bar-"] rect {
    fill: url(#luxBarGrad) !important;
  }

  /* ── Table cost values: use success green ─────────────────────────────── */
  td[data-col="cost"],
  .cost-value {
    color: #00ffa3 !important;
    font-variant-numeric: tabular-nums;
  }

  /* ── Card headings: slightly brighter ─────────────────────────────────── */
  .card-title,
  [class*="CardTitle"] {
    color: #c8dcff;
    letter-spacing: -0.02em;
  }

  /* ── Summary stat numbers: electric cyan pop ─────────────────────────── */
  .stat-value,
  [class*="stat-number"],
  [class*="StatValue"] {
    color: #00e5ff;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ── Focus rings tightened ─────────────────────────────────────────────── */
  *:focus-visible {
    outline: 1.5px solid #00e5ff;
    outline-offset: 2px;
  }

  /* ── Scrollbar ─────────────────────────────────────────────────────────── */
  ::-webkit-scrollbar {
    width: 4px;
    height: 4px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(0, 229, 255, 0.25);
    border-radius: 2px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 229, 255, 0.5);
  }
